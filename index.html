<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Guarda-Roupa</title>
<meta name="apple-mobile-web-app-title" content="Guarda-Roupa">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F7F7F5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F0F10" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
#login{position:fixed;inset:0;z-index:100;background:var(--bg);overflow:auto;display:flex;align-items:flex-start;justify-content:center;padding:calc(env(safe-area-inset-top,0px) + 48px) 20px 40px}
#login .lg{width:100%;max-width:400px;display:flex;flex-direction:column;gap:14px}
#login h1{margin:0}
#login label{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:600}
#login input{min-height:50px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:0 14px;font:inherit;font-size:16px;font-weight:400}
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:0}
body{margin:0;font-size:14px}
img{max-width:100%}
[hidden]{display:none!important}
*,*::before,*::after{box-sizing:border-box}
/* Layout: one-screen phone app, scrolling content between a header and a fixed bottom tab bar */
:root{
  --bg:#F7F7F5; --surface:#FFFFFF; --sunk:#F0F0EC; --line:#E8E8E3; --fg:#141414; --muted:#6E6E68;
  --accent:#141414; --accent-ink:#FFFFFF; --accent-soft:#F0F0EC; --accent-soft-ink:#141414; --accent-mid:#A3A39D;
  --new:#FCEDE6; --new-ink:#9A3B12; --tile:#FFFFFF; --star:#E0A100; --star-off:#E1E1DC;
  --fcp:#0A3A8C; --ok:#1F7A55;
  --font-display:Inter,ui-sans-serif,system-ui,-apple-system,sans-serif;
  --font-body:Inter,ui-sans-serif,system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F0F10; --surface:#18181A; --sunk:#222225; --line:#2C2C30; --fg:#F2F2EF; --muted:#9C9C97;
  --accent:#F2F2EF; --accent-ink:#111112; --accent-soft:#242428; --accent-soft-ink:#EDEDEA; --accent-mid:#5A5A5E;
  --new:#3A2418; --new-ink:#F6C2A6; --tile:#F4F4F1; --dg-b:#F4F4F1; --star:#F2B23A; --star-off:#3C3C40; --fcp:#7FA6E8; --ok:#6CC9A0; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F0F10; --surface:#18181A; --sunk:#222225; --line:#2C2C30; --fg:#F2F2EF; --muted:#9C9C97;
  --accent:#F2F2EF; --accent-ink:#111112; --accent-soft:#242428; --accent-soft-ink:#EDEDEA; --accent-mid:#5A5A5E;
  --new:#3A2418; --new-ink:#F6C2A6; --tile:#F4F4F1; --dg-b:#F4F4F1; --star:#F2B23A; --star-off:#3C3C40; --fcp:#7FA6E8; --ok:#6CC9A0; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:flex;flex-direction:column;height:100%;max-width:560px;margin:0 auto}
main{flex:1;overflow-y:auto;padding-block:22px 32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:22px}
main>*{flex-shrink:0}
.eyebrow{margin:0;font-size:13px;color:var(--muted);font-weight:500}
h1{margin:0;font-family:var(--font-display);font-size:30px;font-weight:700;letter-spacing:-.8px;text-wrap:balance}
h2{margin:0;font-family:var(--font-display);font-size:17px;font-weight:650;letter-spacing:-.2px;text-wrap:balance}
h3{margin:0;font-size:15px;font-weight:600}
.head{display:flex;flex-direction:column;gap:2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px;box-shadow:0 1px 2px rgba(0,0,0,.03);display:flex;flex-direction:column;gap:12px;min-width:0}
.btn{min-height:46px;border-radius:14px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:15px;padding:0 16px;display:flex;align-items:center;justify-content:center;gap:8px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn[disabled]{opacity:.5;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>.btn{flex:1 1 140px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.chip{flex:none;min-height:34px;padding:0 13px;border-radius:17px;border:1px solid var(--line);background:var(--surface);font-weight:500;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.toolbar{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.toolbar label{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:8px}
select{min-height:38px;border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:0 10px;font-size:14px;font-weight:500}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (min-width:480px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.tile{padding:0;border:none;background:none;text-align:left;display:flex;flex-direction:column;gap:4px;min-width:0}
.tile .pic{width:100%;aspect-ratio:1;max-width:100%;border-radius:20px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;background:var(--tile);margin-bottom:3px}
.tile .pic img{width:78%;height:78%;object-fit:contain}
.tile .name{font-size:14px;font-weight:600;padding-left:4px}
.tile .sub{font-size:12px;color:var(--muted);padding-left:4px;font-variant-numeric:tabular-nums}
.tile .sub.cold{color:var(--new-ink)}
.note{margin:0;padding:12px 14px;border-radius:14px;background:var(--sunk);color:var(--fg);font-size:14px}
.empty{padding:22px 16px;border-radius:20px;border:2px dashed var(--line);color:var(--muted);text-align:center;font-size:14px;display:flex;flex-direction:column;gap:6px;align-items:center}
.uploads{display:flex;flex-direction:column;gap:10px}
.up{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px}
.up .thumb{width:56px;height:56px;border-radius:10px;object-fit:cover;flex:none;background:var(--sunk)}
.up .meta{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.up .meta small{color:var(--muted);font-size:13px;overflow-wrap:anywhere}
.badge{flex:none;padding:4px 10px;border-radius:10px;font-size:12px;font-weight:600;background:var(--sunk);color:var(--muted);white-space:nowrap}
.badge.pend{background:var(--new);color:var(--new-ink)}
.badge.ok{background:var(--accent-soft);color:var(--accent-soft-ink)}
label.field{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:500}
textarea,input[type="text"]{border-radius:12px;border:1px solid var(--line);background:var(--bg);padding:10px 12px}
textarea{min-height:64px;resize:vertical}
.seg{display:flex;padding:3px;border-radius:14px;background:var(--sunk);gap:3px}
.seg button{flex:1;min-height:38px;border:none;border-radius:11px;background:transparent;font-weight:500;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:6px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.status{font-size:14px;color:var(--muted);margin:0}
.status.err{color:var(--new-ink);background:var(--new);padding:10px 12px;border-radius:12px}
.stack{display:flex;flex-direction:column;gap:12px}
.mini{display:flex;gap:8px;flex-wrap:wrap}
.mini span{width:56px;height:56px;border-radius:12px;background:var(--tile);border:1px solid var(--line);display:flex;align-items:center;justify-content:center}
.mini img{width:80%;height:80%;object-fit:contain}
/* stars */
.stars{position:relative;display:inline-block;font-size:22px;line-height:1;white-space:nowrap}
.stars::before{content:"★★★★★";color:var(--star-off)}
.stars>i{position:absolute;left:0;top:0;overflow:hidden;white-space:nowrap;color:var(--star);font-style:normal}
.stars>i::before{content:"★★★★★"}
.rate{display:flex;flex-direction:column;gap:6px}
.rate-top{display:flex;align-items:center;gap:10px}
.rate-top b{font-variant-numeric:tabular-nums;font-size:15px;min-width:3.2em}
.rate input[type=range]{width:100%;accent-color:var(--star);min-height:32px}
/* tab bar */
nav.tabs{display:flex;justify-content:space-around;background:color-mix(in srgb,var(--surface) 92%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-top:6px;padding-bottom:calc(6px + env(safe-area-inset-bottom,0px));padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
nav.tabs button{flex:1;min-height:54px;border:none;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;font-weight:500;color:var(--muted)}
nav.tabs button[aria-current="page"]{color:var(--fg);font-weight:600}
nav.tabs svg{width:24px;height:24px}
/* sheets */
.sheet-wrap{position:fixed;inset:0;background:rgba(10,12,11,.5);display:flex;flex-direction:column;justify-content:flex-end;z-index:20}
.sheet-wrap>.scrim{flex:1;border:none;background:transparent;min-height:40px}
.sheet{background:var(--surface);border-radius:26px 26px 0 0;max-height:90%;overflow-y:auto;padding-top:10px;padding-bottom:calc(24px + env(safe-area-inset-bottom,0px));padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px;max-width:560px;width:100%;margin:0 auto;box-sizing:border-box}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.x{flex:none;width:44px;height:44px;border-radius:22px;border:none;background:var(--sunk);display:flex;align-items:center;justify-content:center}
.hero{background:var(--tile);border-radius:20px;display:flex;align-items:center;justify-content:center;height:280px}
.hero img{width:270px;height:270px;max-width:90%;object-fit:contain}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tags span{padding:6px 10px;border-radius:10px;background:var(--sunk);font-size:13px}
.swatch{width:22px;height:22px;border-radius:11px;border:1px solid var(--line);flex:none}
.orig{display:flex;gap:12px;align-items:center;padding:10px;border-radius:16px;border:1px solid var(--line)}
.orig img{width:64px;height:64px;border-radius:10px;object-fit:contain;background:#E4E3DE}
.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.kv div{background:var(--sunk);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kv small{font-size:12px;color:var(--muted)}
.kv strong{font-size:18px;font-weight:600}
/* builder */
.req{display:flex;gap:6px;flex-wrap:wrap}
.req span{padding:5px 10px;border-radius:10px;font-size:13px;font-weight:500;background:var(--new);color:var(--new-ink)}
.req span.ok{background:var(--accent-soft);color:var(--accent-soft-ink)}
.pickrow{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px}
.pick{flex:none;width:96px;padding:0;border:none;background:none;display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:500;text-align:center}
.pick .pic{width:96px;height:96px;border-radius:16px;background:var(--tile);border:2px solid var(--line);display:flex;align-items:center;justify-content:center;position:relative}
.pick .pic img{width:80%;height:80%;object-fit:contain}
.pick[aria-pressed="true"] .pic{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.pick[aria-pressed="true"] .pic::after{content:"✓";position:absolute;top:6px;right:6px;width:22px;height:22px;border-radius:11px;background:var(--accent);color:var(--accent-ink);font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center}
/* stats */
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:4px;min-width:0}
.kpi small{font-size:12px;color:var(--muted);font-weight:500}
.kpi strong{font-size:26px;font-weight:600;line-height:1.1}
.kpi span{font-size:12px;color:var(--muted)}
.bars{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:36px minmax(0,1fr);gap:10px;align-items:center}
.bar .ic{width:36px;height:36px;border-radius:10px;background:var(--tile);border:1px solid var(--line);display:flex;align-items:center;justify-content:center}
.bar .ic img{width:80%;height:80%;object-fit:contain}
.bar .lab{display:flex;justify-content:space-between;gap:8px;font-size:13px;margin-bottom:4px}
.bar .lab span:last-child{color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.bar .track{height:10px;border-radius:5px;background:var(--sunk);overflow:hidden}
.bar .fill{height:100%;border-radius:0 4px 4px 0;background:var(--accent)}
.bar .fill.cold{background:var(--new-ink)}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,1fr);gap:3px}
.heat i{display:block;aspect-ratio:1;border-radius:3px;background:var(--sunk)}
.heat i.on{background:var(--accent)}
.heat i.future{background:transparent}
.heatwrap{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px;align-items:start}
.heatdays{display:grid;grid-template-rows:repeat(7,1fr);gap:3px;font-size:10px;color:var(--muted);height:100%}
.heatdays span{display:flex;align-items:center}
.months{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:4px;padding-left:22px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);align-items:center}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:5px}
.colorbar{display:flex;gap:2px;height:28px;border-radius:8px;overflow:hidden}
.colorbar span{display:block;height:100%}
.colorlist{display:flex;flex-direction:column;gap:6px;font-size:13px}
.colorlist div{display:flex;align-items:center;gap:8px}
.colorlist b{margin-left:auto;font-weight:500;color:var(--muted);font-variant-numeric:tabular-nums}
.pairs{display:flex;flex-direction:column;gap:8px}
.pair{display:flex;align-items:center;gap:10px;font-size:13px}
.pair .mini span{width:40px;height:40px;border-radius:10px}
.pair b{margin-left:auto;font-weight:500;color:var(--muted);white-space:nowrap}
.dress{position:relative;aspect-ratio:10/18;max-width:100%;flex:none;background:var(--tile);border-radius:18px;border:1px solid var(--line);overflow:hidden}
.dress .dl{position:absolute;height:auto;max-width:none;pointer-events:none;filter:drop-shadow(0 2px 3px rgba(0,0,0,.18))}
.dress .dw{position:absolute;pointer-events:none}
.dress .dw img{display:block;width:100%;height:auto;filter:drop-shadow(0 2px 3px rgba(0,0,0,.18))}
.ltog{display:flex;flex-wrap:wrap;gap:6px}
.wx{display:flex;flex-direction:column;gap:10px;padding:12px 14px;border-radius:16px;background:var(--surface);border:1px solid var(--line);font-size:14px}
.wx p{margin:0}
.rank{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;margin-right:8px;border-radius:50%;background:var(--fg);color:var(--bg);font-size:13px;font-weight:700;vertical-align:2px}
.pick-fit .dress{border-radius:12px;margin:0 auto}
.pick-fit{width:96px}
.dress-empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:16px;font-size:13px;color:#6A6A64}
.dz-sticky{position:sticky;top:-10px;z-index:3;box-shadow:0 6px 12px -8px rgba(0,0,0,.25);padding:6px}
.dz-sticky img,.dz-sticky img:only-child{width:auto;height:130px;aspect-ratio:1}
.dz-hint{background:var(--accent-soft);color:var(--accent-soft-ink);padding:8px 10px;border-radius:10px;font-weight:600}
.sw-photo{background:var(--surface);color:var(--fg);display:flex;align-items:center;justify-content:center;border-style:dashed}
.starbar{padding:6px 0;border:none;background:none;line-height:0}
.stars.big{font-size:34px;letter-spacing:0}
.rstep{display:flex;gap:6px;margin-left:auto}
.rstep button{width:40px;height:40px;border-radius:20px;border:1px solid var(--line);background:var(--surface);font-size:20px;font-weight:600}
.dz-preview{display:flex;gap:10px;justify-content:center;background:var(--tile);border-radius:18px;border:1px solid var(--line);padding:10px}
.dz-preview img{width:min(44%,190px);aspect-ratio:1;object-fit:contain}
.dz-preview img:only-child{width:min(70%,240px)}
.dz-canvas{width:100%;max-width:100%;height:auto;border-radius:14px;border:1px solid var(--line);touch-action:manipulation;cursor:crosshair;background:var(--sunk)}
.swrow{display:flex;flex-wrap:wrap;gap:8px}
.sw{width:36px;height:36px;border-radius:18px;border:2px solid var(--line);padding:0;position:relative;overflow:hidden}
.sw[aria-pressed="true"]{box-shadow:0 0 0 3px var(--accent)}
.sw-custom{background:conic-gradient(#E53935,#FDD835,#43A047,#1E88E5,#8E24AA,#E53935);display:inline-block}
.sw-custom input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.seg-sm{align-self:flex-start}
.kseg button{min-height:34px;font-size:13px}
.badge.kb-treino{background:#E4EEDF;color:#3C5A2E}
.badge.kb-jogo{background:#DCE6F5;color:#123E7C}
@media (prefers-color-scheme: dark){.badge.kb-treino{background:#2C3A26;color:#BFD9B2}.badge.kb-jogo{background:#1C2B44;color:#B9CCEE}}
.seg-sm button{min-height:36px;padding:0 12px;font-size:13px;flex:none}
.fitview{display:flex;gap:12px;align-items:flex-start}
.sidx{display:flex;align-items:baseline;gap:6px;width:100%;min-height:44px;padding:0 14px;border-radius:14px;border:1px solid var(--line);background:var(--surface);font-size:14px;color:var(--muted)}
.sidx span{margin-right:auto}.sidx b{font-size:20px;font-weight:600;color:var(--fg)}.sidx small{font-size:12px}.sidx svg{align-self:center;margin-left:4px}
.sidx.ok b{color:var(--accent)}
.sparts{display:flex;flex-direction:column;gap:10px;background:var(--sunk);border-radius:14px;padding:12px}
.sparts .sp-top{display:flex;justify-content:space-between;align-items:baseline;font-size:14px;font-weight:500}
.sparts .sp-top small{font-weight:400;color:var(--muted);font-size:12px}
.sparts .sp-bar{height:5px;border-radius:3px;background:var(--line);margin:4px 0;overflow:hidden}
.sparts .sp-bar i{display:block;height:100%;border-radius:3px;background:var(--accent)}
.sparts p{margin:0;font-size:13px;color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom));z-index:60;max-width:min(92vw,420px);padding:12px 16px;border-radius:14px;background:var(--fg);color:var(--bg);font-size:14px;box-shadow:0 6px 24px rgba(0,0,0,.18)}
.toast[hidden]{display:none}
@media (min-width:900px){.toast{bottom:28px}}
.minsty{display:grid;grid-template-columns:1fr auto;align-items:center;gap:2px 10px;font-size:14px;color:var(--muted)}
.minsty b{color:var(--fg);font-weight:600}
.minsty input{grid-column:1/-1;width:100%;accent-color:var(--accent)}
.fr-stage{position:relative;background:var(--tile);border:1px solid var(--line);border-radius:16px;padding:6px}
.fr-hist{position:absolute;left:12px;bottom:12px;display:flex;gap:4px;background:rgba(255,255,255,.92);border:1px solid #D6D6D0;border-radius:22px;padding:3px;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.fr-hist button{width:36px;height:36px;border-radius:18px;border:none;background:#F1F0EC;color:#222;font-size:18px;line-height:1}
.fr-hist button:disabled{opacity:.35}
.fr-lib{display:flex;flex-direction:column;gap:8px}

<body>
<div class="app">
  <main id="main" aria-live="polite"></main>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <nav class="tabs" aria-label="Secções">
    <button id="tab-hoje" data-tab="hoje"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg>Hoje</button>
    <button id="tab-armario" data-tab="armario"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M12 4a2 2 0 1 1 2 2c-1 0-2 .7-2 1.7V8l9 7.5c.6.5.2 1.5-.6 1.5H3.6c-.8 0-1.2-1-.6-1.5L12 8"/></svg>Armário</button>
    <button id="tab-fits" data-tab="fits"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l2.6 5.6L20.5 9l-4.4 4 1.2 6L12 16l-5.3 3 1.2-6-4.4-4 5.9-.4z"/></svg>Fits</button>
    <button id="tab-stats" data-tab="stats"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M5 20V11M12 20V5M19 20v-6"/></svg>Estatísticas</button>
  </nav>
</div>
<div id="sheet" hidden></div>
<div id="viewer" class="viewer" role="dialog" aria-modal="true" aria-label="Foto em grande" hidden></div>
<input id="file" class="sr" type="file" accept="image/*,video/*" tabindex="-1" aria-hidden="true">
<input id="dfile" class="sr" type="file" accept="image/*" tabindex="-1" aria-hidden="true">
<input id="ifile" class="sr" type="file" accept="application/json,.json" tabindex="-1" aria-hidden="true">

<script>
// ---------- local storage layer (IndexedDB) ----------
// Same small API the app used with Claude's db/assets capabilities:
//   db.collection(name).orderBy(f, dir).limit(n).onSnapshot(cb, err)
//   db.collection(name).add(data) -> {id, update(patch)}
//   db.doc('col/id').set(data) / .update(patch) / .delete()
//   assets.upload(blob, {type}) -> {id, url}
const LS = (() => {
  const DB_NAME = 'guarda-roupa', DB_VER = 2;
  let onLocal = null;              // set by the cloud sync: called after every local change
  const cols = new Map();          // name -> Map(id -> data)
  const listeners = new Set();     // {col, run}
  const urls = new Map();          // asset id -> object URL
  let idb = null;

  const open = () => new Promise((res, rej) => {
    const r = indexedDB.open(DB_NAME, DB_VER);
    r.onupgradeneeded = () => {
      const d = r.result;
      if (!d.objectStoreNames.contains('docs')) d.createObjectStore('docs', { keyPath: 'k' });
      if (!d.objectStoreNames.contains('blobs')) d.createObjectStore('blobs', { keyPath: 'id' });
      if (!d.objectStoreNames.contains('outbox')) d.createObjectStore('outbox', { keyPath: 'k' });
    };
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
  const tx = (store, mode, fn) => new Promise((res, rej) => {
    const t = idb.transaction(store, mode); const s = t.objectStore(store); let out;
    Promise.resolve(fn(s)).then((v) => { out = v; });
    t.oncomplete = () => res(out); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
  });
  const reqP = (r) => new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
  const col = (n) => { if (!cols.has(n)) cols.set(n, new Map()); return cols.get(n); };
  const newId = (len) => { const a = new Uint8Array(len); crypto.getRandomValues(a); return Array.from(a, (b) => 'abcdefghijklmnopqrstuvwxyz0123456789'[b % 36]).join(''); };
  const hexId = () => { const a = new Uint8Array(16); crypto.getRandomValues(a); return Array.from(a, (b) => b.toString(16).padStart(2, '0')).join(''); };
  const clone = (o) => JSON.parse(JSON.stringify(o));

  function notify(name) { listeners.forEach((l) => { if (l.col === name) l.run(); }); }
  // outbox: local changes waiting to be sent to the cloud (one entry per doc / asset, newest wins)
  let seq = Date.now();
  async function queue(entries) {
    if (!entries.length) return;
    await tx('outbox', 'readwrite', (s) => { entries.forEach((e) => s.put(Object.assign({ seq: ++seq }, e))); });
    if (onLocal) onLocal();
  }
  const docEntry = (name, id) => { const v = col(name).get(id); return { k: 'doc:' + name + '/' + id, kind: 'doc', col: name, id, data: v ? clone(v) : null, deleted: !v }; };
  async function persist(name, id, remote) {
    const v = col(name).get(id);
    await tx('docs', 'readwrite', (s) => v ? s.put({ k: name + '/' + id, col: name, id, data: v }) : s.delete(name + '/' + id));
    if (!remote) await queue([docEntry(name, id)]);
  }
  function query(name, spec) {
    let rows = Array.from(col(name).entries()).map(([id, d]) => ({ id, d }));
    if (spec.order) { const [f, dir] = spec.order; rows.sort((a, b) => { const x = a.d[f], y = b.d[f]; const c = x < y ? -1 : x > y ? 1 : 0; return dir === 'desc' ? -c : c; }); }
    if (spec.limit) rows = rows.slice(0, spec.limit);
    return { docs: rows.map((r) => ({ id: r.id, data: () => clone(r.d) })) };
  }
  function docRef(name, id) {
    return {
      id,
      async set(data) { col(name).set(id, clone(data)); await persist(name, id); notify(name); },
      async update(patch) { const cur = col(name).get(id); if (!cur) throw new Error('not_found'); col(name).set(id, Object.assign({}, cur, clone(patch))); await persist(name, id); notify(name); },
      async delete() { col(name).delete(id); await persist(name, id); notify(name); },
      async get() { const v = col(name).get(id); return { exists: !!v, data: () => v && clone(v) }; }
    };
  }
  function collection(name) {
    const spec = {};
    const q = {
      orderBy(f, dir) { spec.order = [f, dir || 'asc']; return q; },
      limit(n) { spec.limit = n; return q; },
      onSnapshot(cb, err) { const l = { col: name, run: () => { try { cb(query(name, spec)); } catch (e) { if (err) err(e); } } }; listeners.add(l); setTimeout(l.run, 0); return () => listeners.delete(l); },
      async add(data) { const id = newId(20); await docRef(name, id).set(data); return docRef(name, id); }
    };
    return q;
  }
  const db = { collection, doc(path) { const [c, id] = path.split('/'); return docRef(c, id); } };

  const assets = {
    async upload(blob, opts) {
      const id = hexId(); const type = (opts && opts.type) || blob.type || 'application/octet-stream';
      const b = blob.type === type ? blob : new Blob([blob], { type });
      await tx('blobs', 'readwrite', (s) => s.put({ id, type, blob: b, size: b.size, at: new Date().toISOString() }));
      const url = URL.createObjectURL(b); urls.set(id, url);
      await queue([{ k: 'asset:' + id, kind: 'asset', id, op: 'up' }]);
      return { id, url, sizeBytes: b.size, contentType: type };
    },
    async remove(id) { await tx('blobs', 'readwrite', (s) => s.delete(id)); await queue([{ k: 'asset:' + id, kind: 'asset', id, op: 'rm' }]); const u = urls.get(id); if (u) URL.revokeObjectURL(u); urls.delete(id); },
    url: (id) => urls.get(id) || ''
  };

  async function init() {
    idb = await open();
    const docs = await tx('docs', 'readonly', (s) => reqP(s.getAll()));
    docs.forEach((r) => col(r.col).set(r.id, r.data));
    const blobs = await tx('blobs', 'readonly', (s) => reqP(s.getAll()));
    blobs.forEach((r) => urls.set(r.id, URL.createObjectURL(r.blob)));
    ['pieces', 'fits', 'days', 'uploads', 'games', 'push'].forEach(col);
    return { db, assets };
  }

  // ----- backup -----
  const b64 = (blob) => new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(String(fr.result).split(',')[1] || ''); fr.onerror = () => rej(fr.error); fr.readAsDataURL(blob); });
  async function exportAll() {
    const data = {}; cols.forEach((m, n) => { data[n] = Array.from(m.entries()).map(([id, d]) => Object.assign({ id }, d)); });
    const blobs = await tx('blobs', 'readonly', (s) => reqP(s.getAll()));
    const files = {}; for (const r of blobs) files[r.id] = { type: r.type, b64: await b64(r.blob) };
    return { app: 'guarda-roupa', format: 1, exportedAt: new Date().toISOString(), data, assets: files };
  }
  async function importAll(json, mode) {
    if (!json || json.app !== 'guarda-roupa' || !json.data) throw new Error('bad_file');
    if (mode === 'replace' && !Object.values(json.data).some((a) => a && a.length)) mode = 'merge'; // a patch-only file never wipes anything
    if (mode === 'replace') {
      await tx('docs', 'readwrite', (s) => s.clear()); await tx('blobs', 'readwrite', (s) => s.clear());
      urls.forEach((u) => URL.revokeObjectURL(u)); urls.clear(); cols.forEach((m) => m.clear());
    }
    const files = json.assets || {};
    for (const id of Object.keys(files)) {
      const f = files[id]; const bin = atob(f.b64); const arr = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
      const blob = new Blob([arr], { type: f.type });

}

// ---------- stats ----------
function viewStats() { // com filtro por tipo de outfit (normal, treino, dia de jogo)
  S.wornKind = KINDS[S.statKind] ? S.statKind : null;

}
function viewStatsInner() {
  const t = today(), since = periodStart(), sk = S.wornKind;
  const days = worn().filter((d) => d.date >= since);
  // as peças que fazem sentido em cada tipo: no treino, a roupa de treino (se houver); nos outros, tudo menos a de treino
  const P = sk === 'treino' ? (S.pieces.some(isTreino) ? S.pieces.filter(isTreino) : S.pieces) : sk === 'jogo' ? (S.pieces.some(isPorto) ? S.pieces.filter(isPorto) : S.pieces) : sk ? S.pieces.filter(isCasual) : S.pieces;
  const kLabel = sk === 'treino' ? 'de treino' : sk === 'jogo' ? 'de jogo' : sk ? 'normais' : '';
  let h = '<div class="head"><p class="eyebrow">Para usares a roupa toda</p><h1>Estatísticas</h1></div>';
  h += '<div class="chips" role="group" aria-label="Período">' + I('calendar', 18).replace('class="i"', 'class="i" style="align-self:center;color:var(--muted)"') + PERIODS.map((p) => '<button class="chip" data-period="' + p.id + '" aria-pressed="' + (S.period === p.id) + '">' + p.label + '</button>').join('') + '</div>';
  h += '<div class="seg kseg" role="group" aria-label="Tipo de outfit">' + [['all', 'Todos']].concat(Object.keys(KINDS).map((k) => [k, KIND_SHORT[k]])).map(([k, l]) => '<button data-statkind="' + k + '" aria-pressed="' + ((sk || 'all') === k) + '">' + (KIND_IC[k] ? I(KIND_IC[k], 16) : '') + '<span>' + l + '</span></button>').join('') + '</div>';
  if (sk) h += '<p class="meta-line">' + I('tag', 15) + 'Só os outfits ' + kLabel + (sk === 'treino' && S.pieces.some(isTreino) ? ', com a tua roupa de treino' : sk === 'jogo' && S.pieces.some(isPorto) ? ', com a tua roupa do Porto' : sk === 'normal' ? ', com a tua roupa casual' : '') + '</p>';
  h += '<!--fcpz-->';
  if (!worn().length) return h + '<div class="empty">' + (sk ? 'Ainda não tens outfits ' + kLabel + ' registados.' : 'Ainda não há dias registados. Escolhe o fit de hoje ou envia a foto do dia.') + '</div>';

  const counts = P.map((p) => ({ p, n: wearsOf(p.id, since).length, s: sinceLast(p) }));
  const usedN = counts.filter((c) => c.n > 0).length;
  const forgotten = counts.filter((c) => c.s === null || c.s >= 30);
  const ranked = counts.slice().sort((a, b) => b.n - a.n);
  const top = ranked[0] && (!ranked[1] || ranked[0].n > ranked[1].n) ? ranked[0] : null;
  const rated = sk ? [...new Set(worn().map(dayFit).filter((f) => f && typeof f.rating === 'number'))] : S.fits.filter((f) => typeof f.rating === 'number');
  const avg = rated.length ? rated.reduce((s, f) => s + f.rating, 0) / rated.length : null;

  h += '<div class="kpis">'
    + '<div class="kpi"><small>' + (sk === 'treino' ? 'Dias de treino' : sk === 'jogo' ? 'Dias de jogo' : sk ? 'Dias normais' : 'Dias registados') + '</small><strong>' + nDates(days) + '</strong><span>' + periodLabel() + '</span></div>'
    + '<div class="kpi"><small>Armário usado</small><strong>' + (P.length ? Math.round(usedN / P.length * 100) : 0) + '%</strong><span>' + usedN + ' de ' + P.length + ' peças</span></div>'
    + '<div class="kpi"><small>Paradas há 30+ dias</small><strong>' + forgotten.length + '</strong><span>inclui nunca usadas</span></div>'
    + '<div class="kpi"><small>Avaliação média</small><strong>' + (avg == null ? '–' : num(avg.toFixed(1))) + '</strong><span>' + rated.length + ' fits avaliados</span></div>'
    + '</div>';

  // uso por peça
  const max = Math.max(1, ...counts.map((c) => c.n));
  h += '<section class="card" aria-labelledby="st-uso"><h2 id="st-uso">Uso por peça</h2><p class="status" style="font-size:13px">Vezes que usaste cada peça · ' + periodLabel() + (top && top.n ? ' · mais usada: ' + esc(top.p.name) : '') + '</p><div class="bars">'
    + counts.slice().sort((a, b) => b.n - a.n || a.p.name.localeCompare(b.p.name, 'pt')).map((c) =>
      '<button class="bar" data-open="' + esc(c.p.id) + '" style="border:none;background:none;padding:0;text-align:left" title="' + esc(c.p.name) + ': ' + c.n + '×"><span class="ic"><img src="' + pieceSrc(c.p) + '" alt=""></span><span><span class="lab"><span>' + esc(c.p.name) + '</span><span>' + c.n + '×</span></span><span class="track"><span class="fill" style="display:block;width:' + (c.n / max * 100) + '%"></span></span></span></button>').join('')
    + '</div></section>';

  // há quanto tempo
  const cold = counts.slice().sort((a, b) => coldScore(b.p) - coldScore(a.p));
  const maxS = Math.max(1, ...cold.map((c) => c.s === null ? diffDays(addedDay(c.p), t) : c.s));
  h += '<section class="card" aria-labelledby="st-cold"><h2 id="st-cold">Há quanto tempo não usas</h2><p class="status" style="font-size:13px">As do topo são as que estão a pedir para sair do armário.</p><div class="bars">'
    + cold.slice(0, 10).map((c) => {
      const v = c.s === null ? diffDays(addedDay(c.p), t) : c.s;
      const lab = c.s === null ? 'nunca · no armário há ' + v + ' d' : (c.s === 0 ? 'hoje' : ago(c.s));
      return '<button class="bar" data-open="' + esc(c.p.id) + '" style="border:none;background:none;padding:0;text-align:left" title="' + esc(c.p.name) + ': ' + esc(lab) + '"><span class="ic"><img src="' + pieceSrc(c.p) + '" alt=""></span><span><span class="lab"><span>' + esc(c.p.name) + '</span><span>' + esc(lab) + '</span></span><span class="track"><span class="fill' + (c.s === null || c.s >= 30 ? ' cold' : '') + '" style="display:block;width:' + Math.max(2, v / maxS * 100) + '%"></span></span></span></button>';
    }).join('')
    + '</div></section>';

  // calendário (últimas 12 semanas)
  const weeks = 12, end = parse(t); const start = new Date(end); start.setDate(start.getDate() - end.getDay() - (weeks - 1) * 7);
  const wornSet = new Map(worn().map((d) => [d.date, KINDS[kindOf(d)]]));
  let cells = '', monthsLab = [], lastM = -1;
  for (let w = 0; w < weeks; w++) {
    for (let d = 0; d < 7; d++) {
      const dt = new Date(start); dt.setDate(start.getDate() + w * 7 + d); const iso = isoDay(dt);
      if (d === 0 && dt.getMonth() !== lastM) { monthsLab.push(MONTHS[dt.getMonth()]); lastM = dt.getMonth(); }
      if (iso > t) { cells += '<i class="future"></i>'; continue; }
      const on = wornSet.has(iso);
      cells += '<i class="' + (on ? 'on' : '') + '" title="' + esc(fmtShort(iso) + (on ? ' · ' + wornSet.get(iso) : ' · sem registo')) + '"></i>';
    }
  }
  const last84 = nDates(worn().filter((d) => d.date >= isoDay(start)));
  h += '<section class="card" aria-labelledby="st-cal"><h2 id="st-cal">Dias registados</h2><p class="status" style="font-size:13px">Últimas 12 semanas · ' + last84 + ' dias com fit registado</p>'
    + '<div class="heatwrap"><div class="heatdays" aria-hidden="true"><span>D</span><span></span><span>T</span><span></span><span>Q</span><span></span><span>S</span></div><div class="heat" role="img" aria-label="Calendário com ' + last84 + ' dias registados nas últimas 12 semanas">' + cells + '</div></div>'
    + '<div class="months" aria-hidden="true">' + monthsLab.map((m) => '<span>' + m + '</span>').join('') + '</div>'
    + '<div class="legend"><span><i style="background:var(--accent)"></i>Fit registado</span><span><i style="background:var(--sunk)"></i>Sem registo</span></div></section>';

  // cores que vestes
  const colorW = new Map();
  days.forEach((d) => (d.pieces || []).forEach((id) => { const p = pieceById(id); if (p && p.color) { const k = p.color.toUpperCase(); const e = colorW.get(k) || { n: 0, names: new Set() }; e.n++; e.names.add(p.name); colorW.set(k, e); } }));
  const colors = [...colorW.entries()].sort((a, b) => b[1].n - a[1].n);
  const totalC = colors.reduce((s, [, e]) => s + e.n, 0);
  if (totalC) {
    h += '<section class="card" aria-labelledby="st-cor"><h2 id="st-cor">Cores que vestes</h2><p class="status" style="font-size:13px">Peso de cada cor nos fits registados · ' + periodLabel() + '</p>'
      + '<div class="colorbar" role="img" aria-label="Distribuição de cores">' + colors.map(([c, e]) => '<span style="flex:' + e.n + ';background:' + esc(c) + '" title="' + esc([...e.names].join(', ')) + '"></span>').join('') + '</div>'
      + '<div class="colorlist">' + colors.map(([c, e]) => '<div><span class="swatch" style="background:' + esc(c) + '"></span><span>' + esc([...e.names].join(', ')) + '</span><b>' + Math.round(e.n / totalC * 100) + '%</b></div>').join('') + '</div></section>';
  }

  // pares mais usados
  const pairs = new Map();
  const pairSeen = new Set(); // um par conta uma vez por dia, mesmo que apareça em dois outfits
  days.forEach((d) => { const ids = (d.pieces || []).filter(pieceById).slice().sort(); for (let i = 0; i < ids.length; i++) for (let j = i + 1; j < ids.length; j++) { const k = ids[i] + '|' + ids[j]; if (pairSeen.has(d.date + k)) continue; pairSeen.add(d.date + k); pairs.set(k, (pairs.get(k) || 0) + 1); } });
  const topPairs = [...pairs.entries()].sort((a, b) => b[1] - a[1]).slice(0, 5);
  if (topPairs.length) {
    h += '<section class="card" aria-labelledby="st-par"><h2 id="st-par">Combinações que repetes</h2><p class="status" style="font-size:13px">Pares de peças usadas juntas mais vezes</p><div class="pairs">'
      + topPairs.map(([k, n]) => { const [a, b] = k.split('|').map(pieceById); return '<div class="pair"><span class="mini"><span><img src="' + pieceSrc(a) + '" alt=""></span><span><img src="' + pieceSrc(b) + '" alt=""></span></span><span>' + esc(a.name) + ' + ' + esc(b.name) + '</span><b>' + n + '×</b></div>'; }).join('')
      + '</div></section>';
  }

  // uso por categoria
  const bySub = SUBS.map((s) => { const ps = P.filter((p) => subOf(p) === s.id); const used = ps.filter((p) => wearsOf(p.id, since).length).length; return { s, total: ps.length, used }; }).filter((x) => x.total);
  h += '<section class="card" aria-labelledby="st-cat"><h2 id="st-cat">Peças usadas por categoria</h2><p class="status" style="font-size:13px">Quantas peças de cada tipo saíram do armário · ' + periodLabel() + '</p><div class="bars">'
    + bySub.map((x) => '<div><div class="lab" style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px"><span>' + x.s.label + '</span><span style="color:var(--muted);font-variant-numeric:tabular-nums">' + x.used + ' de ' + x.total + '</span></div><div class="track" style="height:10px;border-radius:5px;background:var(--sunk);overflow:hidden"><div style="height:100%;width:' + (x.used / x.total * 100) + '%;background:var(--accent);border-radius:0 4px 4px 0"></div></div></div>').join('')
    + '</div></section>';

  // melhores fits
  const best = rated.slice().sort((a, b) => b.rating - a.rating).slice(0, 3);
  if (best.length) {
    h += '<section class="card" aria-labelledby="st-best"><h2 id="st-best">Fits mais bem avaliados</h2><div class="stack">'
      + best.map((f) => '<div class="pair"><span class="mini">' + (f.pieces || []).map(pieceById).filter(Boolean).slice(0, 4).map((p) => '<span><img src="' + pieceSrc(p) + '" alt=""></span>').join('') + '</span><span style="display:flex;flex-direction:column;gap:2px;margin-left:auto;align-items:flex-end">' + starHtml(f.rating) + '</span></div>').join('')
      + '</div></section>';
  }
  return h;
}

  if (kind !== 'treino') return !isTreino(p);

async function saveBuilder(mode) {
  const B = S.builder; if (!B || !builderState().ok || !db) return;
  const nameEl = document.getElementById('bname');
  const title = (nameEl && nameEl.value.trim()) || 'O meu fit';
  const pieces = B.sel.slice().sort((a, b) => SUB_ORDER.indexOf(subOf(pieceById(a))) - SUB_ORDER.indexOf(subOf(pieceById(b))));
  try {
    const under = UNDER[B.under] ? B.under : '', socks = SOCKS[B.socks] ? B.socks : '', closed = !!B.closed && hasOuter(pieces), opened = cleanOpened(uids({ under }, pieces), B.opened), kind = KINDS[B.kind] ? B.kind : 'normal';
    if (mode === 'fit') {
      const f = S.fits.find((x) => x.id === B.editFit); if (!f) { S.builder = null; renderSheet(); return; }
      const other = fitOf(pieces, f.id);
      if (other) { // now the same pieces as another fit: they become one (that one), with this one's rating if it had none
        const patch = { closed, opened, under, socks, kind };
        if (typeof other.rating !== 'number' && typeof f.rating === 'number') patch.rating = f.rating;
        if (f.status === 'gosto' && other.status !== 'gosto') patch.status = 'gosto';
        const auto = (x) => !x || x === 'O meu fit' || / \(variação\)$/.test(x) || /^Proposta de /.test(x);
        if (auto(other.title) && !auto(title)) patch.title = title;
        await db.doc('fits/' + other.id).update(patch);
        for (const d of S.days.filter((x) => x.fit === f.id)) await db.doc('days/' + d.id).update({ fit: other.id });
        await db.doc('fits/' + f.id).delete();
        toast('Já tinhas um fit com estas peças: ficaram um só.');
      } else {
        await db.doc('fits/' + f.id).update({ title, pieces, closed, opened, under, socks, kind, editedAt: new Date().toISOString() });
        toast('Fit atualizado.');
      }
      S.builder = null; renderSheet(); render(); return;
    }
    if (mode === 'edit') {
      const day = dayById(B.editDay) || { id: B.editDay, date: today() }, t = day.date;
      const f = day.fit && S.fits.find((x) => x.id === day.fit);
      const same = f && f.pieces && fitKey(f.pieces) === fitKey(pieces) && (f.under || '') === under && (f.socks || '') === socks;
      const other = fitOf(pieces, f && f.id); // these pieces are already a fit: the day becomes that one
      let fitId = day.fit || null;
      if (other) {
        fitId = other.id;
        const patch = { closed, opened, under, socks, lastUsed: t, timesUsed: fitDays(other).filter((x) => x.date !== t).length + 1 };
        if (kind !== 'normal' && kindOf(other) === 'normal') patch.kind = kind;
        if (f && typeof other.rating !== 'number' && typeof f.rating === 'number') patch.rating = f.rating;
        if (other.status !== 'gosto') patch.status = 'gosto';
        await db.doc('fits/' + other.id).update(patch);
        if (f && f.source === 'eu' && !S.days.some((x) => x.id !== day.id && x.fit === f.id)) await db.doc('fits/' + f.id).delete(); // the copy made just for this day
      }
      else if (f && f.source === 'eu' && (f.timesUsed || 0) <= 1) await db.doc('fits/' + f.id).update({ title, pieces, closed, opened, under, socks, kind });
      else if (!same) { const r = await db.collection('fits').add({ title, pieces, reason: '', tags: [], status: 'gosto', source: 'eu', kind, closed, opened, under, socks, lastUsed: t, timesUsed: 1, createdAt: new Date().toISOString() }); fitId = r.id; }
      await db.doc('days/' + day.id).set({ date: t, title, pieces, reason: same ? (day.reason || '') : '', worn: true, closed, opened, under, socks, kind, slot: day.slot || 1, fit: fitId, chosenAt: day.chosenAt || new Date().toISOString(), editedAt: new Date().toISOString() });
      S.builder = null; renderSheet(); return;
    }
    const t = today(), old = fitOf(pieces);
    // same pieces as a fit I already have (or wore): it is that fit, so its rating and history stay together
    const past = worn().filter((d) => d.date !== t && fitKey(d.pieces || []) === fitKey(pieces));
    let fitId;
    if (old) {
      fitId = old.id;
      const patch = { closed, opened, under, socks };
      if (kind !== 'normal') patch.kind = kind;
      if (old.status !== 'gosto') patch.status = 'gosto';
      const auto = (x) => !x || x === 'O meu fit' || / \(variação\)$/.test(x) || /^Proposta de /.test(x);
      if (auto(old.title) && !auto(title)) patch.title = title; // a name I typed replaces an automatic one
      await db.doc('fits/' + old.id).update(patch);
    } else fitId = (await db.collection('fits').add({ title, pieces, reason: '', tags: [], status: 'gosto', source: 'eu', kind, closed, opened, under, socks, createdAt: new Date().toISOString() })).id;
    for (const d of past) if (d.fit !== fitId) await db.doc('days/' + d.id).update({ fit: fitId });
    const dates = [...new Set(past.map((d) => d.date).concat(mode === 'hoje' ? [t] : []))].sort();
    if (mode === 'hoje') await wearToday({ title, pieces, reason: '', closed, opened, under, socks, fit: fitId }, kind);
    if (dates.length) await db.doc('fits/' + fitId).update({ lastUsed: dates[dates.length - 1], timesUsed: dates.length });
    S.builder = null; toast(old ? 'Já tinhas um fit com estas peças. Fica tudo nesse.' : past.length ? 'Juntei-o ' + (past.length === 1 ? 'ao dia em que já o usaste' : 'aos ' + past.length + ' dias em que já o usaste') + '.' : '');
    renderSheet(); render();
  } catch (e) {}
}

const V = { s: 1, x: 0, y: 0, ptr: new Map(), start: null, lastTap: 0 };

function relPt(e) { const box = document.getElementById('vbox').getBoundingClientRect(); return { x: e.clientX - box.left - box.width / 2, y: e.clientY - box.top - box.height / 2 }; }
function openViewer(id, alt, kind) {
  S.viewer = { id, alt, kind }; V.s = 1; V.x = 0; V.y = 0; V.ptr.clear();
  const el = document.getElementById('viewer'); el.hidden = false;
  el.innerHTML = '<div class="vtop"><span id="vz">100%</span><span style="display:flex;gap:8px">'
    + (kind === 'video' ? '' : '<button class="vbtn" data-vzoom="0.6667" aria-label="Diminuir zoom">−</button><button class="vbtn" data-vzoom="1.5" aria-label="Aumentar zoom">+</button>')
    + '<button class="vbtn" data-vclose aria-label="Fechar"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></span></div>'
    + '<div id="vbox" class="vbox">' + (kind === 'video' ? '<video src="' + blob(id) + '" controls playsinline autoplay muted style="max-width:100%;max-height:100%"></video>' : '<img id="vimg" src="' + blob(id) + '" alt="' + esc(alt) + '" draggable="false">') + '</div>'
    + (kind === 'video' ? '' : '<p class="vhint">Junta ou afasta dois dedos para zoom · toque duplo para aproximar</p>');
  const box = document.getElementById('vbox');
  if (kind !== 'video') {
    box.addEventListener('pointerdown', vDown); box.addEventListener('pointermove', vMove);
    box.addEventListener('pointerup', vUp); box.addEventListener('pointercancel', vUp);
    box.addEventListener('wheel', (e) => { e.preventDefault(); const p = relPt(e); zoomAt(Math.min(6, Math.max(1, V.s * (e.deltaY < 0 ? 1.15 : 1 / 1.15))), p.x, p.y); }, { passive: false });
  }
  const c = el.querySelector('[data-vclose]'); if (c) c.focus({ preventScroll: true });
}
function closeViewer() { S.viewer = null; const el = document.getElementById('viewer'); el.hidden = true; el.innerHTML = ''; }
function snapStart() {
  const pts = [...V.ptr.values()];
  if (pts.length >= 2) { const [a, b] = pts; V.start = { mode: 'pinch', d: Math.hypot(a.x - b.x, a.y - b.y) || 1, mx: (a.x + b.x) / 2, my: (a.y + b.y) / 2, s: V.s, x: V.x, y: V.y }; }
  else if (pts.length === 1) { V.start = { mode: 'pan', px: pts[0].x, py: pts[0].y, x: V.x, y: V.y }; }
  else V.start = null;
}
function vDown(e) {
  e.currentTarget.setPointerCapture(e.pointerId); V.ptr.set(e.pointerId, relPt(e)); snapStart();
  if (V.ptr.size === 1) { const now = Date.now(); if (now - V.lastTap < 300) { const p = relPt(e); zoomAt(V.s > 1.05 ? 1 : 2.5, p.x, p.y); V.lastTap = 0; } else V.lastTap = now; }
}
function vMove(e) {
  if (!V.ptr.has(e.pointerId)) return; V.ptr.set(e.pointerId, relPt(e)); const st = V.start; if (!st) return;
  if (st.mode === 'pinch' && V.ptr.size >= 2) {
    const [a, b] = [...V.ptr.values()]; const d = Math.hypot(a.x - b.x, a.y - b.y) || 1; const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
    const ns = Math.min(6, Math.max(1, st.s * d / st.d)); const ix = (st.mx - st.x) / st.s, iy = (st.my - st.y) / st.s;

function vUp(e) { V.ptr.delete(e.pointerId); snapStart(); }

async function toJpeg(file) {
  const okType = file.type === 'image/jpeg' || file.type === 'image/png' || file.type === 'image/webp';
  let bmp;
  try { bmp = await createImageBitmap(file); } catch (e) { if (okType) return file; throw { code: 'decode' }; }
  const max = 2000, k = Math.min(1, max / Math.max(bmp.width, bmp.height));
  if (k === 1 && okType && file.size < 4e6) return file;
  const c = document.createElement('canvas'); c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
  c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
  return await new Promise((res) => c.toBlob((b) => res(b), 'image/jpeg', 0.88));
}

async function handleFile(file) {
  if (!file || !assets || !db) return;
  S.busy = true; S.msg = ''; S.msgErr = false; render();
  const isVideo = (file.type || '').startsWith('video/');
  try {
    let body = file, type;
    if (isVideo) { if (file.size > 20 * 1024 * 1024) throw { code: 'too_large' }; type = file.type === 'video/webm' ? 'video/webm' : 'video/mp4'; }
    else { body = await toJpeg(file); type = body.type || 'image/jpeg'; }
    const up = await assets.upload(body, { type });
    const noteEl = document.getElementById('upnote');
    await db.collection('uploads').add({ asset: up.id, kind: isVideo ? 'video' : 'photo', type: S.upKind, date: today(), note: (noteEl && noteEl.value.trim()) || '', status: 'diario', createdAt: new Date().toISOString() });
    S.msg = 'Guardado.';
  } catch (e) {
    S.msgErr = true;
    const c = e && e.code;
    S.msg = c === 'too_large' ? 'O vídeo tem mais de 20 MB. Grava em 1080p (Definições › Câmara › Gravar vídeo) ou faz um vídeo mais curto.'
      : c === 'decode' ? 'Não consegui ler esta imagem. Tenta escolher a foto outra vez ou tirar uma nova.'
      : c === 'unsupported_type' ? 'Este formato não é aceite. Usa uma foto ou um vídeo normal do iPhone.'
      : c === 'quota_or_state' ? 'Sem espaço no aparelho. Faz uma cópia de segurança e apaga fotos antigas.'
      : c === 'rate_limited' ? 'Demasiados envios seguidos. Espera um minuto e tenta outra vez.'
      : 'O envio falhou. Verifica a ligação e tenta outra vez.';
  }
  S.busy = false; render();
}

// ---------- procedural garment drawings (piece designer) ----------
const shade = (hex, k) => {
  let n = parseInt(String(hex || '#888888').replace('#', ''), 16); if (isNaN(n)) n = 0x888888;
  let r = n >> 16 & 255, g = n >> 8 & 255, b = n & 255;
  if (k <= 1) { r *= k; g *= k; b *= k; } else { const t = k - 1; r += (255 - r) * t; g += (255 - g) * t; b += (255 - b) * t; }
  return '#' + [r, g, b].map((v) => Math.round(Math.max(0, Math.min(255, v))).toString(16).padStart(2, '0')).join('');
};
const lum = (hex) => { const n = parseInt(String(hex).replace('#', ''), 16) || 0; return (0.299 * (n >> 16 & 255) + 0.587 * (n >> 8 & 255) + 0.114 * (n & 255)) / 255; };
const contrastOf = (c) => lum(c) > 0.55 ? shade(c, 0.72) : shade(c, 1.45);
let uidN = 0;
const clipWrap = (clipD, inner) => { if (!inner) return ''; const id = 'pc' + (++uidN); return '<clipPath id="' + id + '"><path d="' + clipD + '"/></clipPath><g clip-path="url(#' + id + ')">' + inner + '</g>'; };
function rnd(seed) { let s = seed; return () => (s = (s * 9301 + 49297) % 233280) / 233280; }

function patternInner(kind, c, c2) {
  let inner = '';
  if (kind === 'riscas') for (let y = 30; y < 400; y += 18) inner += '<rect x="0" y="' + y + '" width="400" height="7" fill="' + c2 + '" opacity="0.9"/>';
  if (kind === 'riscas-v') for (let x = 4; x < 400; x += 16) inner += '<rect x="' + x + '" y="0" width="5" height="400" fill="' + c2 + '" opacity="0.85"/>';

  if (t.dataset.kind) { S.upKind = t.dataset.kind; S.msg = ''; render(); return; }
  if (t.dataset.lt) { // open / close one layer (casaco, camisola, camisa), each on its own
    const scope = t.dataset.lt, id = t.dataset.ltId, layer = t.dataset.ltLayer, on = t.dataset.ltOpen === '1';
    const tgt = scope === 'b' ? S.builder : scope === 'fit' ? S.fits.find((x) => x.id === id) : dayById(id);
    if (!tgt) return;
    const patch = layer === 'outer' ? { closed: !on } : { opened: (tgt.opened || []).filter((x) => x !== layer).concat(on ? [layer] : []) };
    Object.assign(tgt, patch);
    if (scope === 'b') { const n = document.getElementById('bname'); if (n) S.builder.title = n.value; renderSheet(); return; }
    render(); if (db) db.doc((scope === 'fit' ? 'fits/' : 'days/') + id).update(patch).catch(() => {});
    return;
  }
  if (t.dataset.fitBase || t.dataset.bbase) { baseBuilder(t.dataset.fitBase || t.dataset.bbase); return; }
  if (t.dataset.pset) { const p = pieceById(S.open); if (!p) return; const patch = { [t.dataset.pset]: t.dataset.pval || '' }; Object.assign(p, patch); genCache.clear(); render(); if (db) db.doc('pieces/' + p.id).update(patch).catch(() => {}); return; }
  if (t.hasAttribute('data-show-top')) { S.showTop = true; render(); return; }
  if (t.hasAttribute('data-wx-locate')) { pref('wxmanual', ''); if (wxLoc() && wxNow().src !== 'live') { WX.tried = 0; render(); wxFetch(); } else wxLocate(); return; }
  if (t.dataset.wxManual) { pref('wxmanual', pref('wxmanual') === t.dataset.wxManual ? '' : t.dataset.wxManual); render(); return; }
  if (t.dataset.propUse || t.dataset.propEdit || t.dataset.propSkip) {
    const x = proposals().list[Number(t.dataset.propUse || t.dataset.propEdit || t.dataset.propSkip)]; if (!x) return;
    if (t.dataset.propUse) useProposal(x);
    else if (t.dataset.propEdit) { S.open = null; S.builder = { sel: x.ids.slice(), title: '', kind: S.kind }; renderSheet(); }
    else { pref('skip', JSON.stringify({ day: today(), keys: propSkips().concat(x.key) })); render(); }
    return;
  }
  if (t.dataset.kindPick) { S.kind = t.dataset.k; render(); return; }
  if (t.dataset.bkind) { const n = document.getElementById('bname'); if (n) S.builder.title = n.value; bSwitchKind(t.dataset.k); renderSheet(); return; }
  if (t.dataset.dayKind) { const d = dayById(t.dataset.dayKind); if (!d || !db) return; d.kind = t.dataset.k; render(); db.doc('days/' + d.id).update({ kind: t.dataset.k }).catch(() => {}); return; }
  if (t.hasAttribute('data-add-outfit')) { openPropose(true); return; }
  if (t.hasAttribute('data-prop-open')) { openPropose(false); return; }
  if (t.hasAttribute('data-prop-close')) { S.propOpen = false; S.adding = false; render(); document.getElementById('main').scrollTop = 0; return; }
  if (t.hasAttribute('data-up-toggle')) { S.upOpen = !S.upOpen; render(); return; }
  if (t.hasAttribute('data-filt-toggle')) { S.filtOpen = !(S.filtOpen || focusPieces().length || S.pickPiece); if (!S.filtOpen) { S.pickPiece = false; } render(); return; }
  if (t.dataset.optToggle) { S.optOpen = S.optOpen === t.dataset.optToggle ? null : t.dataset.optToggle; render(); return; }
  if (t.dataset.delDay) { S.confirmDay = S.confirmDay === t.dataset.delDay ? null : t.dataset.delDay; render(); return; }
  if (t.hasAttribute('data-del-day-cancel')) { S.confirmDay = null; render(); return; }
  if (t.dataset.delDayOk) { const id = t.dataset.delDayOk; S.confirmDay = null; if (db) db.doc('days/' + id).delete().then(() => toast('Tirei esse outfit de hoje.')).catch(() => {}); return; }
  if (t.dataset.gameGo) {
    const g = S.games.find((x) => x.id === t.dataset.gameGo); if (!g || !db) return;
    const going = t.dataset.v === '1' ? true : t.dataset.v === '0' ? false : null;
    g.going = going; if (going && g.date === today()) S.kind = 'jogo';
    db.doc('games/' + g.id).update({ going, answeredAt: new Date().toISOString() }).catch(() => {});
    if (going && g.date === today() && !outfitsOn(today()).some((o) => kindOf(o) === 'jogo')) openPropose(false); else render();
    return;
  }
  if (t.hasAttribute('data-game-fit')) { S.kind = 'jogo'; openPropose(false); return; }
  if (t.hasAttribute('data-push-on')) { enablePush(); return; }
  if (t.dataset.pbelong) {
    const p = pieceById(S.open); if (!p || p.virtual || !db) return;
    const k = t.dataset.pbelong, cur = belongsOf(p), set = cur.includes(k) ? cur.filter((x) => x !== k) : cur.concat(k);
    if (!set.length) { toast('Tem de pertencer a pelo menos um.'); return; }
    const tags = belongTags(p, set);
    p.tags = tags; renderSheet(); render(); db.doc('pieces/' + p.id).update({ tags }).catch(() => {});
    return;
  }
  if (t.dataset.fitpiece) { const id = t.dataset.fitpiece, cur = S.fitPieces || []; S.fitPieces = cur.includes(id) ? cur.filter((x) => x !== id) : cur.concat(id); S.histN = 14; render(); return; }
  if (t.hasAttribute('data-fitpiece-clear')) { S.fitPieces = []; render(); return; }
  if (t.dataset.fitsOf) { S.fitPieces = [t.dataset.fitsOf]; S.open = null; S.confirmDel = false; renderSheet(); S.tab = 'fits'; pref('tab', 'fits'); render(); const m = document.getElementById('main'); if (m) m.scrollTop = 0; return; }
  if (t.dataset.fitfilter) { S.fitFilter = t.dataset.fitfilter; render(); return; }
  if (t.dataset.fitsview) { S.fitsView = t.dataset.fitsview; render(); document.getElementById('main').scrollTop = 0; return; }
  if (t.dataset.histkind) { S.histKind = t.dataset.histkind; S.histN = 14; render(); return; }
  if (t.hasAttribute('data-hist-more')) { S.histN = (S.histN || 14) + 20; render(); return; }
  if (t.dataset.fitUse) { useFit(t.dataset.fitUse); return; }
  if (t.dataset.fitLike) { const f = S.fits.find((x) => x.id === t.dataset.fitLike); setFitStatus(t.dataset.fitLike, f && f.status === 'gosto' ? 'proposta' : 'gosto'); return; }
  if (t.dataset.fitNo) { setFitStatus(t.dataset.fitNo, 'rejeitada'); return; }
  if (t.id === 'pick') { const f = document.getElementById('file'); f.value = ''; f.click(); }
});
document.addEventListener('change', (ev) => {
  const el = ev.target;
  if (el.id === 'sort') { S.sort = el.value; pref('sort', S.sort); render(); }
});
document.addEventListener('keydown', (e) => { if (e.key !== 'Escape') return; if (S.viewer) { closeViewer(); return; } if (S.designer) { if (frEscape() || !dzMayClose()) return; const a = S.designer.afterSave; S.designer = null; if (a) a(null); renderSheet(true); return; } if (S.open || S.builder) { S.open = null; S.builder = null; S.confirmDel = false; renderSheet(); } });
document.addEventListener('input', (ev) => { const el = ev.target; if (el && el.dataset && 'minstyle' in el.dataset) { const v = document.getElementById('minsty-v'); if (v) v.textContent = Number(el.value) ? el.value : 'qualquer'; } });
document.addEventListener('change', (ev) => { const el = ev.target; if (el && el.dataset && 'minstyle' in el.dataset) { pref('minStyle', String(Number(el.value) || 0)); render(); } });
document.addEventListener('change', (ev) => { // camisola interior of a fit, of a day, or of the fit being built
  const t = ev.target; if (!t || !t.dataset || !t.dataset.usel) return;
  const scope = t.dataset.usel, id = t.dataset.uselId, fld = t.dataset.uselF === 'socks' ? 'socks' : 'under', val = OPTS[fld][1][t.value] ? t.value : '';
  const tgt = scope === 'b' ? S.builder : scope === 'fit' ? S.fits.find((x) => x.id === id) : dayById(id);
  if (!tgt) return;
  tgt[fld] = val;
  if (scope === 'b') { const n = document.getElementById('bname'); if (n) S.builder.title = n.value; renderSheet(); return; }
  render(); if (db) db.doc((scope === 'fit' ? 'fits/' : 'days/') + id).update({ [fld]: val }).catch(() => {});
});
document.getElementById('file').addEventListener('change', (e) => handleFile(e.target.files && e.target.files[0]));
document.getElementById('dfile').addEventListener('change', (e) => dzLoadPhoto(e.target.files && e.target.files[0]));

// ---------- data ----------
const rerender = () => render();
function snapErr() { S.offline = !S.pieces.length; render(); }
async function boot() {
  render();
  try { const r = await LS.init(); db = r.db; assets = r.assets; }
  catch (e) { S.ready = true; S.offline = true; render(); return; }
  Cloud.on(Login.render); Cloud.start(); Login.render();
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) { const had = !!navigator.serviceWorker.controller; let done = false; navigator.serviceWorker.addEventListener('controllerchange', () => { if (had && !done && !S.designer && !S.builder) { done = true; location.reload(); } }); navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then((r) => r.update()).catch(() => {}); }
  if ('serviceWorker' in navigator) navigator.serviceWorker.addEventListener('message', (e) => { if (e.data && e.data.jogo) { S.kind = 'jogo'; S.open = null; renderSheet(); render(); } });
  document.getElementById('ifile').addEventListener('change', (e) => readImport(e.target.files && e.target.files[0]));
  let got = 0; const mark = () => { if (++got >= 4) S.ready = true; rerender(); };
  const sub = (q, key) => q.onSnapshot((s) => {
    S[key] = s.docs.map((x) => ({ id: x.id, ...x.data() }));
    if (key === 'allPieces') {
      S.pieces = S.allPieces.filter((p) => !p.removed);
      const B = S.builder;
      if (B && B.pendingPick && pieceById(B.pendingPick)) { togglePick(B.pendingPick); B.pendingPick = null; if (!S.designer) renderSheet(); }
    }
    if (!S.ready) mark(); else rerender(); }, snapErr);
  sub(db.collection('pieces'), 'allPieces');
  sub(db.collection('uploads').orderBy('createdAt', 'desc').limit(60), 'uploads');
  sub(db.collection('days').orderBy('date', 'desc').limit(1000), 'days');
  sub(db.collection('fits').limit(500), 'fits');
  db.collection('games').onSnapshot((s) => { S.games = s.docs.map((x) => ({ id: x.id, ...x.data() })); if (S.ready) rerender(); }, () => {});
  db.collection('elements').onSnapshot((s) => { S.elements = s.docs.map((x) => ({ id: x.id, ...x.data() })); if (S.designer && S.designer.free && document.getElementById('fr-wrap') && S.designer.free.libOpen) frRender(); }, () => {});
}
boot();
})();
</script>
