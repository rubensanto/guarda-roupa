<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Guarda-Roupa</title>
<meta name="apple-mobile-web-app-title" content="Guarda-Roupa">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F4F4F2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121413" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap">
<style>
#login{position:fixed;inset:0;z-index:100;background:var(--bg);overflow:auto;display:flex;align-items:flex-start;justify-content:center;padding:calc(env(safe-area-inset-top,0px) + 48px) 20px 40px}
#login .lg{width:100%;max-width:400px;display:flex;flex-direction:column;gap:14px}
#login h1{margin:0}
#login label{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:600}
#login input{min-height:50px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:0 14px;font:inherit;font-size:16px;font-weight:400}
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:0}
body{margin:0;font-size:14px}
img{max-width:100%}
[hidden]{display:none!important}
*,*::before,*::after{box-sizing:border-box}
/* Layout: one-screen phone app, scrolling content between a header and a fixed bottom tab bar */
:root{
  --bg:#F4F4F2; --surface:#FFFFFF; --sunk:#EBEBE7; --line:#E0E0DA; --fg:#171717; --muted:#5C5C56;
  --accent:#1F5C4A; --accent-ink:#FFFFFF; --accent-soft:#E1EDE8; --accent-soft-ink:#1C4A3C; --accent-mid:#7FB3A0;
  --new:#FBE6DC; --new-ink:#8A3412; --tile:#FFFFFF; --star:#D98E04; --star-off:#D6D6D0;
  --font-display:"Space Grotesk",ui-sans-serif,system-ui,sans-serif;
  --font-body:Inter,ui-sans-serif,system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121413; --surface:#1C1F1E; --sunk:#262A28; --line:#323735; --fg:#EFEFEC; --muted:#A3A8A5;
  --accent:#5FB898; --accent-ink:#0E1A16; --accent-soft:#1E3530; --accent-soft-ink:#B5E3D1; --accent-mid:#3E7D69;
  --new:#3A2418; --new-ink:#F6C2A6; --tile:#F2F2EF; --star:#F2B23A; --star-off:#45494A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121413; --surface:#1C1F1E; --sunk:#262A28; --line:#323735; --fg:#EFEFEC; --muted:#A3A8A5;
  --accent:#5FB898; --accent-ink:#0E1A16; --accent-soft:#1E3530; --accent-soft-ink:#B5E3D1; --accent-mid:#3E7D69;
  --new:#3A2418; --new-ink:#F6C2A6; --tile:#F2F2EF; --star:#F2B23A; --star-off:#45494A; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:flex;flex-direction:column;height:100%;max-width:560px;margin:0 auto}
main{flex:1;overflow-y:auto;padding-block:20px 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
main>*{flex-shrink:0}
.eyebrow{margin:0;font-size:13px;color:var(--muted);font-weight:500}
h1{margin:0;font-family:var(--font-display);font-size:30px;font-weight:700;letter-spacing:-.4px;text-wrap:balance}
h2{margin:0;font-family:var(--font-display);font-size:19px;font-weight:700;text-wrap:balance}
h3{margin:0;font-size:15px;font-weight:600}
.head{display:flex;flex-direction:column;gap:2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.btn{min-height:50px;border-radius:16px;border:1px solid var(--line);background:var(--surface);font-weight:600;padding:0 16px;display:flex;align-items:center;justify-content:center;gap:8px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn[disabled]{opacity:.5;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>.btn{flex:1 1 140px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.chip{flex:none;min-height:36px;padding:0 14px;border-radius:18px;border:1px solid var(--line);background:var(--surface);font-weight:500;font-size:14px}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.toolbar{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.toolbar label{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:8px}
select{min-height:38px;border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:0 10px;font-size:14px;font-weight:500}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (min-width:480px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.tile{padding:0;border:none;background:none;text-align:left;display:flex;flex-direction:column;gap:4px;min-width:0}
.tile .pic{width:100%;aspect-ratio:1;max-width:100%;border-radius:20px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;background:var(--tile);margin-bottom:3px}
.tile .pic img{width:78%;height:78%;object-fit:contain}
.tile .name{font-size:14px;font-weight:600;padding-left:4px}
.tile .sub{font-size:12px;color:var(--muted);padding-left:4px;font-variant-numeric:tabular-nums}
.tile .sub.cold{color:var(--new-ink)}
.note{margin:0;padding:12px 14px;border-radius:14px;background:var(--accent-soft);color:var(--accent-soft-ink);font-size:14px}
.empty{padding:22px 16px;border-radius:20px;border:2px dashed var(--line);color:var(--muted);text-align:center;font-size:14px;display:flex;flex-direction:column;gap:6px;align-items:center}
.uploads{display:flex;flex-direction:column;gap:10px}
.up{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px}
.up .thumb{width:56px;height:56px;border-radius:10px;object-fit:cover;flex:none;background:var(--sunk)}
.up .meta{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.up .meta small{color:var(--muted);font-size:13px;overflow-wrap:anywhere}
.badge{flex:none;padding:4px 10px;border-radius:10px;font-size:12px;font-weight:600;background:var(--sunk);color:var(--muted);white-space:nowrap}
.badge.pend{background:var(--new);color:var(--new-ink)}
.badge.ok{background:var(--accent-soft);color:var(--accent-soft-ink)}
label.field{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:500}
textarea,input[type="text"]{border-radius:12px;border:1px solid var(--line);background:var(--bg);padding:10px 12px}
textarea{min-height:64px;resize:vertical}
.seg{display:flex;padding:3px;border-radius:14px;background:var(--sunk);gap:3px}
.seg button{flex:1;min-height:40px;border:none;border-radius:11px;background:transparent;font-weight:500;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--surface);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.status{font-size:14px;color:var(--muted);margin:0}
.status.err{color:var(--new-ink);background:var(--new);padding:10px 12px;border-radius:12px}
.stack{display:flex;flex-direction:column;gap:12px}
.mini{display:flex;gap:8px;flex-wrap:wrap}
.mini span{width:56px;height:56px;border-radius:12px;background:var(--tile);border:1px solid var(--line);display:flex;align-items:center;justify-content:center}
.mini img{width:80%;height:80%;object-fit:contain}
/* stars */
.stars{position:relative;display:inline-block;font-size:22px;line-height:1;white-space:nowrap}
.stars::before{content:"★★★★★";color:var(--star-off)}
.stars>i{position:absolute;left:0;top:0;overflow:hidden;white-space:nowrap;color:var(--star);font-style:normal}
.stars>i::before{content:"★★★★★"}
.rate{display:flex;flex-direction:column;gap:6px}
.rate-top{display:flex;align-items:center;gap:10px}
.rate-top b{font-variant-numeric:tabular-nums;font-size:15px;min-width:3.2em}
.rate input[type=range]{width:100%;accent-color:var(--star);min-height:32px}
/* tab bar */
nav.tabs{display:flex;justify-content:space-around;background:var(--surface);border-top:1px solid var(--line);padding-top:6px;padding-bottom:calc(6px + env(safe-area-inset-bottom,0px));padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
nav.tabs button{flex:1;min-height:52px;border:none;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;font-weight:500;color:var(--muted)}
nav.tabs button[aria-current="page"]{color:var(--fg);font-weight:600}
nav.tabs svg{width:24px;height:24px}
/* sheets */
.sheet-wrap{position:fixed;inset:0;background:rgba(10,12,11,.5);display:flex;flex-direction:column;justify-content:flex-end;z-index:20}
.sheet-wrap>.scrim{flex:1;border:none;background:transparent;min-height:40px}
.sheet{background:var(--surface);border-radius:26px 26px 0 0;max-height:90%;overflow-y:auto;padding-top:10px;padding-bottom:calc(24px + env(safe-area-inset-bottom,0px));padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px;max-width:560px;width:100%;margin:0 auto;box-sizing:border-box}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.x{flex:none;width:44px;height:44px;border-radius:22px;border:none;background:var(--sunk);display:flex;align-items:center;justify-content:center}
.hero{background:var(--tile);border-radius:20px;display:flex;align-items:center;justify-content:center;height:280px}
.hero img{width:270px;height:270px;max-width:90%;object-fit:contain}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tags span{padding:6px 10px;border-radius:10px;background:var(--sunk);font-size:13px}
.swatch{width:22px;height:22px;border-radius:11px;border:1px solid var(--line);flex:none}
.orig{display:flex;gap:12px;align-items:center;padding:10px;border-radius:16px;border:1px solid var(--line)}
.orig img{width:64px;height:64px;border-radius:10px;object-fit:cover}
.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.kv div{background:var(--sunk);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kv small{font-size:12px;color:var(--muted)}
.kv strong{font-size:18px;font-weight:600}
/* builder */
.req{display:flex;gap:6px;flex-wrap:wrap}
.req span{padding:5px 10px;border-radius:10px;font-size:13px;font-weight:500;background:var(--new);color:var(--new-ink)}
.req span.ok{background:var(--accent-soft);color:var(--accent-soft-ink)}
.pickrow{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px}
.pick{flex:none;width:96px;padding:0;border:none;background:none;display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:500;text-align:center}
.pick .pic{width:96px;height:96px;border-radius:16px;background:var(--tile);border:2px solid var(--line);display:flex;align-items:center;justify-content:center;position:relative}
.pick .pic img{width:80%;height:80%;object-fit:contain}
.pick[aria-pressed="true"] .pic{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.pick[aria-pressed="true"] .pic::after{content:"✓";position:absolute;top:6px;right:6px;width:22px;height:22px;border-radius:11px;background:var(--accent);color:var(--accent-ink);font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center}
/* stats */
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:4px;min-width:0}
.kpi small{font-size:12px;color:var(--muted);font-weight:500}
.kpi strong{font-size:26px;font-weight:600;line-height:1.1}
.kpi span{font-size:12px;color:var(--muted)}
.bars{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:36px minmax(0,1fr);gap:10px;align-items:center}
.bar .ic{width:36px;height:36px;border-radius:10px;background:var(--tile);border:1px solid var(--line);display:flex;align-items:center;justify-content:center}
.bar .ic img{width:80%;height:80%;object-fit:contain}
.bar .lab{display:flex;justify-content:space-between;gap:8px;font-size:13px;margin-bottom:4px}
.bar .lab span:last-child{color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.bar .track{height:10px;border-radius:5px;background:var(--sunk);overflow:hidden}
.bar .fill{height:100%;border-radius:0 4px 4px 0;background:var(--accent)}
.bar .fill.cold{background:var(--new-ink)}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,1fr);gap:3px}
.heat i{display:block;aspect-ratio:1;border-radius:3px;background:var(--sunk)}
.heat i.on{background:var(--accent)}
.heat i.future{background:transparent}
.heatwrap{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px;align-items:start}
.heatdays{display:grid;grid-template-rows:repeat(7,1fr);gap:3px;font-size:10px;color:var(--muted);height:100%}
.heatdays span{display:flex;align-items:center}
.months{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:4px;padding-left:22px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);align-items:center}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:5px}
.colorbar{display:flex;gap:2px;height:28px;border-radius:8px;overflow:hidden}
.colorbar span{display:block;height:100%}
.colorlist{display:flex;flex-direction:column;gap:6px;font-size:13px}
.colorlist div{display:flex;align-items:center;gap:8px}
.colorlist b{margin-left:auto;font-weight:500;color:var(--muted);font-variant-numeric:tabular-nums}
.pairs{display:flex;flex-direction:column;gap:8px}
.pair{display:flex;align-items:center;gap:10px;font-size:13px}
.pair .mini span{width:40px;height:40px;border-radius:10px}
.pair b{margin-left:auto;font-weight:500;color:var(--muted);white-space:nowrap}
.dress{position:relative;aspect-ratio:10/18;max-width:100%;flex:none;background:var(--tile);border-radius:18px;border:1px solid var(--line);overflow:hidden}
.dress .dl{position:absolute;height:auto;max-width:none;pointer-events:none;filter:drop-shadow(0 2px 3px rgba(0,0,0,.18))}
.dress .dw{position:absolute;pointer-events:none}
.dress .dw img{display:block;width:100%;height:auto;filter:drop-shadow(0 2px 3px rgba(0,0,0,.18))}
.ltog{display:flex;flex-wrap:wrap;gap:6px}
.wx{display:flex;flex-direction:column;gap:8px;padding:12px 14px;border-radius:14px;background:var(--sunk);font-size:14px}
.wx p{margin:0}
.rank{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;margin-right:8px;border-radius:50%;background:var(--accent-soft);color:var(--accent-soft-ink);font-size:13px;font-weight:700;vertical-align:2px}
.pick-fit .dress{border-radius:12px;margin:0 auto}
.pick-fit{width:96px}
.dress-empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:16px;font-size:13px;color:#6A6A64}
.dz-sticky{position:sticky;top:-10px;z-index:3;box-shadow:0 6px 12px -8px rgba(0,0,0,.25);padding:6px}
.dz-sticky img,.dz-sticky img:only-child{width:auto;height:130px;aspect-ratio:1}
.dz-hint{background:var(--accent-soft);color:var(--accent-soft-ink);padding:8px 10px;border-radius:10px;font-weight:600}
.sw-photo{background:var(--surface);color:var(--fg);display:flex;align-items:center;justify-content:center;border-style:dashed}
.starbar{padding:6px 0;border:none;background:none;line-height:0}
.stars.big{font-size:34px;letter-spacing:0}
.rstep{display:flex;gap:6px;margin-left:auto}
.rstep button{width:40px;height:40px;border-radius:20px;border:1px solid var(--line);background:var(--surface);font-size:20px;font-weight:600}
.dz-preview{display:flex;gap:10px;justify-content:center;background:var(--tile);border-radius:18px;border:1px solid var(--line);padding:10px}
.dz-preview img{width:min(44%,190px);aspect-ratio:1;object-fit:contain}
.dz-preview img:only-child{width:min(70%,240px)}
.dz-canvas{width:100%;max-width:100%;height:auto;border-radius:14px;border:1px solid var(--line);touch-action:manipulation;cursor:crosshair;background:var(--sunk)}
.swrow{display:flex;flex-wrap:wrap;gap:8px}
.sw{width:36px;height:36px;border-radius:18px;border:2px solid var(--line);padding:0;position:relative;overflow:hidden}
.sw[aria-pressed="true"]{box-shadow:0 0 0 3px var(--accent)}
.sw-custom{background:conic-gradient(#E53935,#FDD835,#43A047,#1E88E5,#8E24AA,#E53935);display:inline-block}
.sw-custom input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.seg-sm{align-self:flex-start}
.seg-sm button{min-height:36px;padding:0 12px;font-size:13px;flex:none}
.fitview{display:flex;gap:12px;align-items:flex-start}
.usel{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:14px;color:var(--muted)}
.usel select{color:var(--fg);max-width:62%}
.withrow{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 4px}
.withrow button{flex:none;width:56px;height:56px;padding:0;border-radius:12px;background:var(--tile);border:1px solid var(--line);display:flex;align-items:center;justify-content:center}
.withrow button img{width:80%;height:80%;object-fit:contain}
.withrow button[aria-pressed="true"]{border:2px solid var(--fg)}
.mini-col{flex-direction:column;flex-wrap:nowrap;gap:6px}
.mini-col button{width:52px;height:52px;padding:0;border-radius:12px;background:var(--tile);border:1px solid var(--line);display:flex;align-items:center;justify-content:center}
.mini-col button img{width:80%;height:80%;object-fit:contain}
.viewer{position:fixed;inset:0;z-index:40;background:#0B0C0C;color:#F2F2EF;display:flex;flex-direction:column}
.viewer[hidden],#sheet[hidden]{display:none!important}
.vtop{display:flex;justify-content:space-between;align-items:center;padding-top:calc(10px + env(safe-area-inset-top,0px));padding-bottom:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));font-size:13px;color:#B9BCB9;font-variant-numeric:tabular-nums}
.vbtn{width:44px;height:44px;border-radius:22px;border:none;background:#262928;color:#F2F2EF;font-size:22px;display:flex;align-items:center;justify-content:center}
.vbox{flex:1;overflow:hidden;display:flex;align-items:center;justify-content:center;touch-action:none;user-select:none;-webkit-user-select:none}
.vbox img{max-width:100%;max-height:100%;object-fit:contain;transform-origin:center center;will-change:transform;-webkit-user-drag:none;background:#F2F2EF}
.vhint{margin:0;text-align:center;font-size:12px;color:#9A9E9B;padding-top:8px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px))}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}}
/* ---------- computador: menu lateral, conteúdo largo, janelas ao centro ---------- */
@media (min-width:900px){
  html,body{height:100%}
  .app{max-width:none;flex-direction:row;height:100vh}
  nav.tabs{order:-1;flex-direction:column;justify-content:flex-start;gap:4px;width:220px;flex:0 0 220px;border-top:none;border-right:1px solid var(--line);padding:28px 14px}
  nav.tabs::before{content:"Guarda-Roupa";font-weight:700;font-size:18px;padding:0 12px 18px;color:var(--fg)}
  nav.tabs button{flex:0 0 auto;flex-direction:row;justify-content:flex-start;gap:12px;min-height:46px;padding:0 12px;border-radius:12px;font-size:15px}
  nav.tabs button:hover{background:var(--sunk)}
  nav.tabs button[aria-current="page"]{background:var(--sunk)}
  main{gap:22px;padding:36px 44px 48px}
  main>*{width:100%;max-width:1160px;margin-inline:auto}

<script>
// ---------- local storage layer (IndexedDB) ----------
// Same small API the app used with Claude's db/assets capabilities:
//   db.collection(name).orderBy(f, dir).limit(n).onSnapshot(cb, err)
//   db.collection(name).add(data) -> {id, update(patch)}
//   db.doc('col/id').set(data) / .update(patch) / .delete()
//   assets.upload(blob, {type}) -> {id, url}
const LS = (() => {
  const DB_NAME = 'guarda-roupa', DB_VER = 2;
  let onLocal = null;              // set by the cloud sync: called after every local change
  const cols = new Map();          // name -> Map(id -> data)
  const listeners = new Set();     // {col, run}
  const urls = new Map();          // asset id -> object URL
  let idb = null;

  const open = () => new Promise((res, rej) => {
    const r = indexedDB.open(DB_NAME, DB_VER);
    r.onupgradeneeded = () => {
      const d = r.result;
      if (!d.objectStoreNames.contains('docs')) d.createObjectStore('docs', { keyPath: 'k' });
      if (!d.objectStoreNames.contains('blobs')) d.createObjectStore('blobs', { keyPath: 'id' });
      if (!d.objectStoreNames.contains('outbox')) d.createObjectStore('outbox', { keyPath: 'k' });
    };
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
  const tx = (store, mode, fn) => new Promise((res, rej) => {
    const t = idb.transaction(store, mode); const s = t.objectStore(store); let out;
    Promise.resolve(fn(s)).then((v) => { out = v; });
    t.oncomplete = () => res(out); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
  });
  const reqP = (r) => new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
  const col = (n) => { if (!cols.has(n)) cols.set(n, new Map()); return cols.get(n); };
  const newId = (len) => { const a = new Uint8Array(len); crypto.getRandomValues(a); return Array.from(a, (b) => 'abcdefghijklmnopqrstuvwxyz0123456789'[b % 36]).join(''); };
  const hexId = () => { const a = new Uint8Array(16); crypto.getRandomValues(a); return Array.from(a, (b) => b.toString(16).padStart(2, '0')).join(''); };
  const clone = (o) => JSON.parse(JSON.stringify(o));

  function notify(name) { listeners.forEach((l) => { if (l.col === name) l.run(); }); }
  // outbox: local changes waiting to be sent to the cloud (one entry per doc / asset, newest wins)
  let seq = Date.now();
  async function queue(entries) {
    if (!entries.length) return;
    await tx('outbox', 'readwrite', (s) => { entries.forEach((e) => s.put(Object.assign({ seq: ++seq }, e))); });
    if (onLocal) onLocal();
  }
  const docEntry = (name, id) => { const v = col(name).get(id); return { k: 'doc:' + name + '/' + id, kind: 'doc', col: name, id, data: v ? clone(v) : null, deleted: !v }; };
  async function persist(name, id, remote) {
    const v = col(name).get(id);
    await tx('docs', 'readwrite', (s) => v ? s.put({ k: name + '/' + id, col: name, id, data: v }) : s.delete(name + '/' + id));
    if (!remote) await queue([docEntry(name, id)]);
  }
  function query(name, spec) {
    let rows = Array.from(col(name).entries()).map(([id, d]) => ({ id, d }));
    if (spec.order) { const [f, dir] = spec.order; rows.sort((a, b) => { const x = a.d[f], y = b.d[f]; const c = x < y ? -1 : x > y ? 1 : 0; return dir === 'desc' ? -c : c; }); }
    if (spec.limit) rows = rows.slice(0, spec.limit);
    return { docs: rows.map((r) => ({ id: r.id, data: () => clone(r.d) })) };
  }
  function docRef(name, id) {
    return {
      id,
      async set(data) { col(name).set(id, clone(data)); await persist(name, id); notify(name); },
      async update(patch) { const cur = col(name).get(id); if (!cur) throw new Error('not_found'); col(name).set(id, Object.assign({}, cur, clone(patch))); await persist(name, id); notify(name); },
      async delete() { col(name).delete(id); await persist(name, id); notify(name); },
      async get() { const v = col(name).get(id); return { exists: !!v, data: () => v && clone(v) }; }
    };
  }
  function collection(name) {
    const spec = {};
    const q = {
      orderBy(f, dir) { spec.order = [f, dir || 'asc']; return q; },
      limit(n) { spec.limit = n; return q; },
      onSnapshot(cb, err) { const l = { col: name, run: () => { try { cb(query(name, spec)); } catch (e) { if (err) err(e); } } }; listeners.add(l); setTimeout(l.run, 0); return () => listeners.delete(l); },
      async add(data) { const id = newId(20); await docRef(name, id).set(data); return docRef(name, id); }
    };
    return q;
  }
  const db = { collection, doc(path) { const [c, id] = path.split('/'); return docRef(c, id); } };

  const assets = {
    async upload(blob, opts) {
      const id = hexId(); const type = (opts && opts.type) || blob.type || 'application/octet-stream';
      const b = blob.type === type ? blob : new Blob([blob], { type });
      await tx('blobs', 'readwrite', (s) => s.put({ id, type, blob: b, size: b.size, at: new Date().toISOString() }));
      const url = URL.createObjectURL(b); urls.set(id, url);
      await queue([{ k: 'asset:' + id, kind: 'asset', id, op: 'up' }]);
      return { id, url, sizeBytes: b.size, contentType: type };
    },
    async remove(id) { await tx('blobs', 'readwrite', (s) => s.delete(id)); await queue([{ k: 'asset:' + id, kind: 'asset', id, op: 'rm' }]); const u = urls.get(id); if (u) URL.revokeObjectURL(u); urls.delete(id); },
    url: (id) => urls.get(id) || ''
  };

  async function init() {
    idb = await open();
    const docs = await tx('docs', 'readonly', (s) => reqP(s.getAll()));
    docs.forEach((r) => col(r.col).set(r.id, r.data));
    const blobs = await tx('blobs', 'readonly', (s) => reqP(s.getAll()));
    blobs.forEach((r) => urls.set(r.id, URL.createObjectURL(r.blob)));
    ['pieces', 'fits', 'days', 'uploads'].forEach(col);
    return { db, assets };
  }

  // ----- backup -----
  const b64 = (blob) => new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(String(fr.result).split(',')[1] || ''); fr.onerror = () => rej(fr.error); fr.readAsDataURL(blob); });
  async function exportAll() {
    const data = {}; cols.forEach((m, n) => { data[n] = Array.from(m.entries()).map(([id, d]) => Object.assign({ id }, d)); });
    const blobs = await tx('blobs', 'readonly', (s) => reqP(s.getAll()));
    const files = {}; for (const r of blobs) files[r.id] = { type: r.type, b64: await b64(r.blob) };
    return { app: 'guarda-roupa', format: 1, exportedAt: new Date().toISOString(), data, assets: files };
  }
  async function importAll(json, mode) {
    if (!json || json.app !== 'guarda-roupa' || !json.data) throw new Error('bad_file');
    if (mode === 'replace') {
      await tx('docs', 'readwrite', (s) => s.clear()); await tx('blobs', 'readwrite', (s) => s.clear());
      urls.forEach((u) => URL.revokeObjectURL(u)); urls.clear(); cols.forEach((m) => m.clear());
    }
    const files = json.assets || {};
    for (const id of Object.keys(files)) {
      const f = files[id]; const bin = atob(f.b64); const arr = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
      const blob = new Blob([arr], { type: f.type });
      await tx('blobs', 'readwrite', (s) => s.put({ id, type: f.type, blob, size: blob.size, at: json.exportedAt }));
      if (urls.has(id)) URL.revokeObjectURL(urls.get(id)); urls.set(id, URL.createObjectURL(blob));
    }
    await queue(Object.keys(files).map((id) => ({ k: 'asset:' + id, kind: 'asset', id, op: 'up' })));
    for (const n of Object.keys(json.data)) {
      for (const row of json.data[n]) { const { id, ...d } = row; col(n).set(id, d); }
      await tx('docs', 'readwrite', (s) => { col(n).forEach((d, id) => s.put({ k: n + '/' + id, col: n, id, data: d })); });
      await queue(json.data[n].map((row) => docEntry(n, row.id)));
    }
    cols.forEach((m, n) => notify(n));
  }
  async function usage() {
    const blobs = await tx('blobs', 'readonly', (s) => reqP(s.getAll()));
    let est = null; try { est = navigator.storage && navigator.storage.estimate ? await navigator.storage.estimate() : null; } catch (e) {}
    let persisted = null; try { persisted = navigator.storage && navigator.storage.persisted ? await navigator.storage.persisted() : null; } catch (e) {}
    return { files: blobs.length, bytes: blobs.reduce((s, r) => s + (r.size || 0), 0), quota: est && est.quota, persisted };
  }
  async function askPersist() { try { return navigator.storage && navigator.storage.persist ? await navigator.storage.persist() : false; } catch (e) { return false; } }
  // ----- hooks used by the cloud sync (cloud.js) -----
  const sync = {
    onLocal(fn) { onLocal = fn; },
    outbox: () => tx('outbox', 'readonly', (s) => reqP(s.getAll())),
    // remove an outbox entry only if nothing newer replaced it meanwhile
    done: (entries) => tx('outbox', 'readwrite', (s) => Promise.all(entries.map((e) => reqP(s.get(e.k)).then((cur) => { if (cur && cur.seq === e.seq) s.delete(e.k); })))),
    requeue: (entries) => queue(entries),
    docEntry,
    applyRemote: async (name, id, data) => {
      const cur = col(name).get(id);
      if (data == null) { if (!cur) return false; col(name).delete(id); }
      else { if (cur && JSON.stringify(cur) === JSON.stringify(data)) return false; col(name).set(id, data); }
      await persist(name, id, true); return true;
    },
    localKeys: () => { const out = []; cols.forEach((m, n) => m.forEach((d, id) => out.push({ col: n, id }))); return out; },
    blobIds: async () => (await tx('blobs', 'readonly', (s) => reqP(s.getAllKeys()))),
    getBlob: async (id) => { const r = await tx('blobs', 'readonly', (s) => reqP(s.get(id))); return r ? r.blob : null; },
    putBlob: async (id, blob) => {
      await tx('blobs', 'readwrite', (s) => s.put({ id, type: blob.type, blob, size: blob.size, at: new Date().toISOString() }));
      if (urls.has(id)) URL.revokeObjectURL(urls.get(id)); urls.set(id, URL.createObjectURL(blob));
    },
    notifyAll: () => cols.forEach((m, n) => notify(n)),
    wipe: async () => {
      await tx('docs', 'readwrite', (s) => s.clear()); await tx('blobs', 'readwrite', (s) => s.clear()); await tx('outbox', 'readwrite', (s) => s.clear());
      urls.forEach((u) => URL.revokeObjectURL(u)); urls.clear(); cols.forEach((m) => m.clear()); cols.forEach((m, n) => notify(n));
    }
  };
  return { sync, init, exportAll, importAll, usage, askPersist, url: (id) => urls.get(id) || '' };
})();

// ---------- cloud sync (Supabase) ----------
// The app keeps working from the local copy (IndexedDB). This module:
//   - signs in with email + password (Supabase Auth REST API, no SDK);
//   - sends local changes (LS outbox) to the table public.docs and the private bucket "wardrobe";
//   - pulls everything back, so any device with the same account sees the same closet.
// Conflict rule: a change not yet sent wins; otherwise the cloud wins. Deletions are kept as tombstones (deleted=true).
const Cloud = (() => {
  const BASE = 'https://cvrmzrrowagkzijunvgm.supabase.co';
  const KEY = 'sb_publishable_LFlo82RCKA4_8HjzMJm4eA_AkX9dSIB';
  const BUCKET = 'wardrobe';
  const SK = 'gr-session', UK = 'gr-last-user';
  const subs = new Set();
  let session = null, running = false, again = false, timer = null;
  const status = { state: 'idle', at: null, msg: '', pending: 0 };

  const ls = { get: (k) => { try { return localStorage.getItem(k); } catch (e) { return null; } }, set: (k, v) => { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} } };
  try { session = JSON.parse(ls.get(SK) || 'null'); } catch (e) { session = null; }
  const save = (s) => { session = s; ls.set(SK, s ? JSON.stringify(s) : null); };
  const emit = () => subs.forEach((fn) => { try { fn(); } catch (e) {} });
  const set = (state, msg) => { status.state = state; status.msg = msg || ''; if (state === 'ok') status.at = new Date().toISOString(); emit(); };

  async function authPost(path, body, bearer) {
    const h = { apikey: KEY, 'Content-Type': 'application/json' }; if (bearer) h.Authorization = 'Bearer ' + bearer;
    const r = await fetch(BASE + '/auth/v1/' + path, { method: 'POST', headers: h, body: JSON.stringify(body || {}) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw Object.assign(new Error(j.msg || j.error_description || j.message || ('HTTP ' + r.status)), { code: j.error_code || j.error || j.code, status: r.status });
    return j;
  }
  const fromToken = (j) => ({ access_token: j.access_token, refresh_token: j.refresh_token, expires_at: j.expires_at || Math.floor(Date.now() / 1000) + (j.expires_in || 3600), user: { id: j.user.id, email: j.user.email } });

  async function adopt(s) {
    const last = ls.get(UK);
    if (last && last !== s.user.id) await LS.sync.wipe();   // another account used this device: start clean
    ls.set(UK, s.user.id); save(s); emit(); sync();
  }
  async function signIn(email, password) { const j = await authPost('token?grant_type=password', { email, password }); await adopt(fromToken(j)); }
  async function signUp(email, password) {
    const back = location.origin + location.pathname;
    const j = await authPost('signup?redirect_to=' + encodeURIComponent(back), { email, password });
    if (j.access_token) { await adopt(fromToken(j)); return { confirm: false }; }
    return { confirm: true };
  }
  async function changePassword(password) {
    const r = await fetch(BASE + '/auth/v1/user', { method: 'PUT', headers: { apikey: KEY, Authorization: 'Bearer ' + await token(), 'Content-Type': 'application/json' }, body: JSON.stringify({ password }) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw Object.assign(new Error(j.msg || j.message || ('HTTP ' + r.status)), { code: j.error_code, status: r.status });
  }
  async function signOut() { const t = session && session.access_token; save(null); emit(); try { if (t) await authPost('logout', {}, t); } catch (e) {} }

  async function token() {
    if (!session) throw Object.assign(new Error('no_session'), { status: 401 });
    if (session.expires_at - 90 > Date.now() / 1000) return session.access_token;
    try { const j = await authPost('token?grant_type=refresh_token', { refresh_token: session.refresh_token }); save(fromToken(j)); }
    catch (e) { if (e.status === 400 || e.status === 401) { save(null); emit(); } throw e; }
    return session.access_token;
  }
  async function api(path, opts) {
    opts = opts || {};
    const h = Object.assign({ apikey: KEY, Authorization: 'Bearer ' + await token() }, opts.headers || {});
    const r = await fetch(BASE + path, Object.assign({}, opts, { headers: h }));
    if (!r.ok) { const t = await r.text().catch(() => ''); throw Object.assign(new Error('HTTP ' + r.status + ' ' + t.slice(0, 160)), { status: r.status }); }
    return r;
  }
  const objPath = (id) => encodeURIComponent(session.user.id) + '/' + encodeURIComponent(id);

  async function pushOutbox() {
    const box = await LS.sync.outbox();
    const docs = box.filter((b) => b.kind === 'doc');
    for (let i = 0; i < docs.length; i += 100) {
      const chunk = docs.slice(i, i + 100);
      await api('/rest/v1/docs?on_conflict=owner,col,id', {
        method: 'POST', headers: { 'Content-Type': 'application/json', Prefer: 'resolution=merge-duplicates,return=minimal' },
        body: JSON.stringify(chunk.map((b) => ({ owner: session.user.id, col: b.col, id: b.id, data: b.deleted ? null : b.data, deleted: !!b.deleted })))
      });
      await LS.sync.done(chunk);
    }
    const files = box.filter((b) => b.kind === 'asset');
    for (const b of files) {
      if (b.op === 'up') {
        const blob = await LS.sync.getBlob(b.id);
        if (blob) await api('/storage/v1/object/' + BUCKET + '/' + objPath(b.id), { method: 'POST', headers: { 'Content-Type': blob.type || 'application/octet-stream', 'x-upsert': 'true', 'cache-control': '31536000' }, body: blob });
      } else {
        await api('/storage/v1/object/' + BUCKET, { method: 'DELETE', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ prefixes: [session.user.id + '/' + b.id] }) });
      }
      await LS.sync.done([b]);
    }
    return box.length;
  }

  async function pull() {
    const rows = await (await api('/rest/v1/docs?select=col,id,data,deleted&limit=50000')).json();
    const pending = new Set((await LS.sync.outbox()).map((b) => b.k));
    const seen = new Set(); let changed = false;
    for (const r of rows) {
      seen.add(r.col + '/' + r.id);
      if (pending.has('doc:' + r.col + '/' + r.id)) continue;
      if (await LS.sync.applyRemote(r.col, r.id, r.deleted ? null : r.data)) changed = true;
    }
    // things that only exist here (made offline, or data from before the account existed) go up
    const missing = LS.sync.localKeys().filter((k) => !seen.has(k.col + '/' + k.id) && !pending.has('doc:' + k.col + '/' + k.id));
    if (missing.length) await LS.sync.requeue(missing.map((k) => LS.sync.docEntry(k.col, k.id)));

    // files
    const remote = new Set();
    for (let off = 0; ; off += 1000) {
      const list = await (await api('/storage/v1/object/list/' + BUCKET, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ prefix: session.user.id + '/', limit: 1000, offset: off, sortBy: { column: 'name', order: 'asc' } }) })).json();
      list.forEach((o) => { if (o && o.name && o.id !== null) remote.add(o.name.split('/').pop()); });
      if (list.length < 1000) break;
    }
    const local = new Set(await LS.sync.blobIds());
    const pend = new Set((await LS.sync.outbox()).filter((b) => b.kind === 'asset').map((b) => b.id));
    const up = [...local].filter((id) => !remote.has(id) && !pend.has(id));
    if (up.length) await LS.sync.requeue(up.map((id) => ({ k: 'asset:' + id, kind: 'asset', id, op: 'up' })));
    const down = [...remote].filter((id) => !local.has(id) && !pend.has(id));
    let i = 0;
    const worker = async () => { while (i < down.length) { const id = down[i++]; try { const r = await api('/storage/v1/object/authenticated/' + BUCKET + '/' + objPath(id)); await LS.sync.putBlob(id, await r.blob()); changed = true; } catch (e) { if (e.status === 401) throw e; } } };
    await Promise.all([worker(), worker(), worker(), worker()]);
    if (changed) LS.sync.notifyAll();
    return missing.length + up.length;
  }

  async function sync() {
    if (!session) return;
    if (!navigator.onLine) { status.pending = (await LS.sync.outbox()).length; set('offline'); return; }
    if (running) { again = true; return; }
    running = true; set('syncing');
    try {
      await pushOutbox();
      const more = await pull();
      if (more) await pushOutbox();
      status.pending = (await LS.sync.outbox()).length;
      set('ok');
    } catch (e) {
      status.pending = (await LS.sync.outbox().catch(() => [])).length;
      if (!session) set('idle'); else set('error', e && e.message ? e.message : String(e));
    } finally {
      running = false;
      if (again) { again = false; schedule(300); }
    }
  }
  function schedule(ms) { clearTimeout(timer); timer = setTimeout(sync, ms == null ? 1500 : ms); }

  function start() {
    LS.sync.onLocal(() => schedule());
    window.addEventListener('online', () => schedule(200));
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') schedule(200); });
    setInterval(() => { if (document.visibilityState === 'visible') sync(); }, 60000);
    // email confirmation link lands back here with tokens in the URL hash
    const h = new URLSearchParams(location.hash.slice(1));
    if (h.get('access_token') && h.get('refresh_token')) {
      history.replaceState(null, '', location.pathname + location.search);
      const exp = Number(h.get('expires_at')) || Math.floor(Date.now() / 1000) + Number(h.get('expires_in') || 3600);

    + '</div></section>';

}

function baseBuilder(id) { // new fit that starts as a copy of an existing one (the original is left alone)
  const f = S.fits.find((x) => x.id === id); if (!f) return;
  S.open = null;
  S.builder = { sel: (f.pieces || []).filter((x) => { const p = pieceById(x); return p && !p.removed; }), title: (f.title || 'Fit') + ' (variação)', closed: !!f.closed, opened: (f.opened || []).slice(), under: f.under || '', baseTitle: f.title || 'Fit' };
  renderSheet(); const sc = document.querySelector('.sheet'); if (sc) sc.scrollTop = 0;
}
function togglePick(id) {
  const p = pieceById(id); if (!p) return;
  const B = S.builder, i = B.sel.indexOf(id);
  if (i >= 0) { B.sel.splice(i, 1); return; }
  const g = groupOf(p), sub = subOf(p);
  // exclusive slots: one outer, one bottom (calças OR calções), one shoe, one per top type
  B.sel = B.sel.filter((x) => { const q = pieceById(x); if (!q) return false;
    if (g === 'acc') return true;
    if (g === 'top') return subOf(q) !== sub;
    return groupOf(q) !== g; });
  B.sel.push(id);
}

async function saveBuilder(mode) {
  const B = S.builder; if (!B || !builderState().ok || !db) return;
  const nameEl = document.getElementById('bname');
  const title = (nameEl && nameEl.value.trim()) || 'O meu fit';
  const pieces = B.sel.slice().sort((a, b) => SUB_ORDER.indexOf(subOf(pieceById(a))) - SUB_ORDER.indexOf(subOf(pieceById(b))));
  try {
    const under = UNDER[B.under] ? B.under : '', closed = !!B.closed && hasOuter(pieces), opened = cleanOpened(uids({ under }, pieces), B.opened);
    if (mode === 'edit') {
      const t = B.editDay, day = S.days.find((x) => x.date === t) || {};
      const f = day.fit && S.fits.find((x) => x.id === day.fit);
      const same = f && f.pieces && f.pieces.slice().sort().join() === pieces.slice().sort().join() && (f.under || '') === under;
      let fitId = day.fit || null;
      if (f && f.source === 'eu' && (f.timesUsed || 0) <= 1) await db.doc('fits/' + f.id).update({ title, pieces, closed, opened, under });
      else if (!same) { const r = await db.collection('fits').add({ title, pieces, reason: '', tags: [], status: 'gosto', source: 'eu', closed, opened, under, lastUsed: t, timesUsed: 1, createdAt: new Date().toISOString() }); fitId = r.id; }
      await db.doc('days/' + t).set({ date: t, title, pieces, reason: same ? (day.reason || '') : '', worn: true, closed, opened, under, fit: fitId, chosenAt: day.chosenAt || new Date().toISOString(), editedAt: new Date().toISOString() });
      S.builder = null; renderSheet(); return;
    }
    const ref = await db.collection('fits').add({ title, pieces, reason: '', tags: [], status: 'gosto', source: 'eu', closed, opened, under, createdAt: new Date().toISOString() });
    if (mode === 'hoje') {
      const t = today();
      await db.doc('days/' + t).set({ date: t, title, pieces, reason: '', worn: true, closed, opened, under, fit: ref.id, chosenAt: new Date().toISOString() });
      await ref.update({ lastUsed: t, timesUsed: 1 });
    }
    S.builder = null; renderSheet();
  } catch (e) {}
}

function renderSheet(force) {
  const el = document.getElementById('sheet');
  const prevTop = (el.querySelector('.sheet') || {}).scrollTop || 0;
  if (S.dataSheet) { el.hidden = false; el.dataset.mode = 'data'; el.innerHTML = dataSheetHtml(); const sc = el.querySelector('.sheet'); if (sc) sc.scrollTop = prevTop; return; }
  if (S.designer) {
    if (!force && el.dataset.mode === 'designer') return; // don't wipe the editor on background data updates
    el.hidden = false; el.dataset.mode = 'designer'; el.innerHTML = designerHtml();
    const sc = el.querySelector('.sheet'); if (sc) sc.scrollTop = prevTop; dzDrawPhoto(); return;
  }
  el.dataset.mode = '';
  if (S.builder) { el.hidden = false; el.innerHTML = builderHtml(); const sc = el.querySelector('.sheet'); if (sc) sc.scrollTop = prevTop; return; }
  const p = S.open && pieceById(S.open);
  if (!p) { el.hidden = true; el.innerHTML = ''; return; }
  el.hidden = false; el.innerHTML = pieceSheet(p);
}

// ---------- photo viewer (pinch / double-tap / buttons) ----------
const V = { s: 1, x: 0, y: 0, ptr: new Map(), start: null, lastTap: 0 };
function applyV() { const img = document.getElementById('vimg'); if (img) img.style.transform = 'translate(' + V.x + 'px,' + V.y + 'px) scale(' + V.s + ')'; const z = document.getElementById('vz'); if (z) z.textContent = Math.round(V.s * 100) + '%'; }
function clampV() { V.s = Math.min(6, Math.max(1, V.s)); if (V.s === 1) { V.x = 0; V.y = 0; } const box = document.getElementById('vbox'); if (box) { const mx = box.clientWidth * (V.s - 1) / 2 + 40, my = box.clientHeight * (V.s - 1) / 2 + 40; V.x = Math.max(-mx, Math.min(mx, V.x)); V.y = Math.max(-my, Math.min(my, V.y)); } }
function zoomAt(ns, cx, cy) { const k = ns / V.s; V.x = cx - (cx - V.x) * k; V.y = cy - (cy - V.y) * k; V.s = ns; clampV(); applyV(); }
function zoomBy(f) { zoomAt(Math.min(6, Math.max(1, V.s * f)), 0, 0); }
function relPt(e) { const box = document.getElementById('vbox').getBoundingClientRect(); return { x: e.clientX - box.left - box.width / 2, y: e.clientY - box.top - box.height / 2 }; }
function openViewer(id, alt, kind) {
  S.viewer = { id, alt, kind }; V.s = 1; V.x = 0; V.y = 0; V.ptr.clear();
  const el = document.getElementById('viewer'); el.hidden = false;
  el.innerHTML = '<div class="vtop"><span id="vz">100%</span><span style="display:flex;gap:8px">'
    + (kind === 'video' ? '' : '<button class="vbtn" data-vzoom="0.6667" aria-label="Diminuir zoom">−</button><button class="vbtn" data-vzoom="1.5" aria-label="Aumentar zoom">+</button>')
    + '<button class="vbtn" data-vclose aria-label="Fechar"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></span></div>'
    + '<div id="vbox" class="vbox">' + (kind === 'video' ? '<video src="' + blob(id) + '" controls playsinline autoplay muted style="max-width:100%;max-height:100%"></video>' : '<img id="vimg" src="' + blob(id) + '" alt="' + esc(alt) + '" draggable="false">') + '</div>'
    + (kind === 'video' ? '' : '<p class="vhint">Junta ou afasta dois dedos para zoom · toque duplo para aproximar</p>');
  const box = document.getElementById('vbox');
  if (kind !== 'video') {
    box.addEventListener('pointerdown', vDown); box.addEventListener('pointermove', vMove);
    box.addEventListener('pointerup', vUp); box.addEventListener('pointercancel', vUp);
    box.addEventListener('wheel', (e) => { e.preventDefault(); const p = relPt(e); zoomAt(Math.min(6, Math.max(1, V.s * (e.deltaY < 0 ? 1.15 : 1 / 1.15))), p.x, p.y); }, { passive: false });
  }
  const c = el.querySelector('[data-vclose]'); if (c) c.focus({ preventScroll: true });
}
function closeViewer() { S.viewer = null; const el = document.getElementById('viewer'); el.hidden = true; el.innerHTML = ''; }
function snapStart() {
  const pts = [...V.ptr.values()];
  if (pts.length >= 2) { const [a, b] = pts; V.start = { mode: 'pinch', d: Math.hypot(a.x - b.x, a.y - b.y) || 1, mx: (a.x + b.x) / 2, my: (a.y + b.y) / 2, s: V.s, x: V.x, y: V.y }; }
  else if (pts.length === 1) { V.start = { mode: 'pan', px: pts[0].x, py: pts[0].y, x: V.x, y: V.y }; }
  else V.start = null;
}
function vDown(e) {
  e.currentTarget.setPointerCapture(e.pointerId); V.ptr.set(e.pointerId, relPt(e)); snapStart();
  if (V.ptr.size === 1) { const now = Date.now(); if (now - V.lastTap < 300) { const p = relPt(e); zoomAt(V.s > 1.05 ? 1 : 2.5, p.x, p.y); V.lastTap = 0; } else V.lastTap = now; }
}
function vMove(e) {
  if (!V.ptr.has(e.pointerId)) return; V.ptr.set(e.pointerId, relPt(e)); const st = V.start; if (!st) return;
  if (st.mode === 'pinch' && V.ptr.size >= 2) {
    const [a, b] = [...V.ptr.values()]; const d = Math.hypot(a.x - b.x, a.y - b.y) || 1; const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
    const ns = Math.min(6, Math.max(1, st.s * d / st.d)); const ix = (st.mx - st.x) / st.s, iy = (st.my - st.y) / st.s;
    V.s = ns; V.x = mx - ns * ix; V.y = my - ns * iy; clampV(); applyV();
  } else if (st.mode === 'pan' && V.s > 1) { const p = V.ptr.get(e.pointerId); V.x = st.x + (p.x - st.px); V.y = st.y + (p.y - st.py); clampV(); applyV(); }
}
function vUp(e) { V.ptr.delete(e.pointerId); snapStart(); }

async function toJpeg(file) {
  const okType = file.type === 'image/jpeg' || file.type === 'image/png' || file.type === 'image/webp';

  const r = cv.getBoundingClientRect(); const x = Math.round((ev.clientX - r.left) / r.width * cv.width), y = Math.round((ev.clientY - r.top) / r.height * cv.height);
  const m = dzAvg(x, y, Math.max(3, Math.round(cv.width / 120)));
  Z.mark = { x, y };
  if (Z.pick === 'wb') { const avg = (m[0] + m[1] + m[2]) / 3; Z.photo.gains = Z.photo.gains.map((g, i) => g * (avg / Math.max(1, m[i]))); Z.photo.tint = 0; Z.photo.temp = 0; Z.pick = Z.afterWb || null; Z.afterWb = null; renderSheet(true); return; }
  const hex = toHex(m); Z.d[Z.pick] = hex; Z.lastPick = { hex, key: Z.pick }; Z.pick = null; renderSheet(true);
}
function dzAutoColor() {
  const Z = S.designer, P = Z && Z.photo; if (!P || !P.clean) return;
  const im = P.clean, W = im.width, H = im.height; const bins = new Map();
  for (let y = Math.round(H * 0.25); y < H * 0.75; y += 3) for (let x = Math.round(W * 0.25); x < W * 0.75; x += 3) {
    const i = (y * W + x) * 4; const r = im.data[i], g = im.data[i + 1], b = im.data[i + 2];
    const k = (r >> 4) + ',' + (g >> 4) + ',' + (b >> 4); const e = bins.get(k) || { n: 0, s: [0, 0, 0] }; e.n++; e.s[0] += r; e.s[1] += g; e.s[2] += b; bins.set(k, e);
  }
  let best = null; bins.forEach((e) => { if (!best || e.n > best.n) best = e; });
  if (!best) return; const hex = toHex(best.s.map((v) => v / best.n));
  Z.d.color = hex; Z.lastPick = { hex, key: 'color' }; Z.mark = null; renderSheet(true);
}
async function dzLoadPhoto(file) {

    const bm = await createImageBitmap(file); const Z = S.designer;

}
async function dzSave() {

        + '<div class="row"><button class="btn primary" data-dp-pwsave' + (S.dataSheet.pwBusy ? ' disabled' : '') + '>' + (S.dataSheet.pwBusy ? 'A guardar…' : 'Guardar') + '</button><button class="btn" data-dp-pwcancel>Cancelar</button></div>'

async function openDataSheet() { S.dataSheet = { usage: null }; renderSheet(true); S.dataSheet.usage = await LS.usage(); if (S.dataSheet) renderSheet(true); }
async function doExport() {
  const D = S.dataSheet; D.busy = 'export'; D.msg = ''; renderSheet(true);
  try {
    const json = await LS.exportAll();
    const blob = new Blob([JSON.stringify(json)], { type: 'application/json' });
    const name = 'guarda-roupa-copia-' + today() + '.json';
    let shared = false;
    try { const file = new File([blob], name, { type: 'application/json' }); if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: name }); shared = true; } } catch (e) { if (e && e.name === 'AbortError') { D.busy = null; renderSheet(true); return; } }
    if (!shared) { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 4000); }
    pref('lastBackup', new Date().toISOString()); D.msg = 'Cópia criada (' + fmtBytes(blob.size) + '). Guarda o ficheiro no iCloud Drive ou nos Ficheiros.'; D.err = false;
  } catch (e) { D.msg = 'Não foi possível criar a cópia.'; D.err = true; }
  D.busy = null; renderSheet(true);
}
async function readImport(file) {
  const D = S.dataSheet; if (!file || !D) return;
  D.busy = 'import'; D.msg = ''; renderSheet(true);
  try {
    const json = JSON.parse(await file.text());
    if (!json || json.app !== 'guarda-roupa' || !json.data) throw new Error('bad');
    D.pending = { json, name: file.name, count: (json.data.pieces || []).length, days: (json.data.days || []).length, files: Object.keys(json.assets || {}).length };
  } catch (e) { D.msg = 'Este ficheiro não é uma cópia de segurança do Guarda-Roupa.'; D.err = true; }
  D.busy = null; renderSheet(true);
}
async function doImport(mode) {
  const D = S.dataSheet; if (!D || !D.pending) return;
  D.busy = 'import'; renderSheet(true);
  try { await LS.importAll(D.pending.json, mode); D.msg = 'Importado: ' + D.pending.count + ' peças e ' + D.pending.days + ' dias.'; D.err = false; D.pending = null; D.usage = await LS.usage(); }
  catch (e) { D.msg = 'A importação falhou. O ficheiro pode estar incompleto.'; D.err = true; }

document.addEventListener('click', (ev) => {
  if (!S.dataSheet) return; const t = ev.target.closest('button'); if (!t) return;
  if (t.hasAttribute('data-dp-close')) { S.dataSheet = null; renderSheet(true); return; }
  if (t.hasAttribute('data-dp-export')) { doExport(); return; }
  if (t.hasAttribute('data-dp-import')) { const f = document.getElementById('ifile'); f.value = ''; f.click(); return; }
  if (t.dataset.dpMode) { doImport(t.dataset.dpMode); return; }
  if (t.hasAttribute('data-dp-cancelimport')) { S.dataSheet.pending = null; renderSheet(true); return; }
  if (t.hasAttribute('data-dp-pw')) { S.dataSheet.pw = true; S.dataSheet.msg = ''; renderSheet(true); setTimeout(() => { const i = document.getElementById('dp-pw'); if (i) i.focus(); }, 50); return; }
  if (t.hasAttribute('data-dp-pwcancel')) { S.dataSheet.pw = false; renderSheet(true); return; }
  if (t.hasAttribute('data-dp-pwsave')) {
    const D = S.dataSheet, v = (document.getElementById('dp-pw') || {}).value || '';
    if (v.length < 6) { D.msg = 'A palavra-passe tem de ter pelo menos 6 caracteres.'; D.err = true; renderSheet(true); return; }
    D.pwBusy = true; renderSheet(true);
    Cloud.changePassword(v).then(() => { D.pw = false; D.msg = 'Palavra-passe mudada. Usa a nova para entrar nos outros aparelhos.'; D.err = false; })
      .catch((e) => { D.msg = /same_password|different/i.test((e.code || '') + e.message) ? 'Escolhe uma palavra-passe diferente da atual.' : 'Não foi possível mudar: ' + e.message; D.err = true; })
      .finally(() => { D.pwBusy = false; if (S.dataSheet) renderSheet(true); });
    return;
  }
  if (t.hasAttribute('data-dp-sync')) { Cloud.sync(); return; }
  if (t.hasAttribute('data-dp-signout')) { S.dataSheet = null; renderSheet(true); Cloud.signOut(); return; }
  if (t.hasAttribute('data-dp-persist')) { LS.askPersist().then(async () => { if (S.dataSheet) { S.dataSheet.usage = await LS.usage(); renderSheet(true); } }); return; }
});

  if (el.id === 'sort') { S.sort = el.value; pref('sort', S.sort); render(); }
});
document.addEventListener('keydown', (e) => { if (e.key !== 'Escape') return; if (S.viewer) { closeViewer(); return; } if (S.designer) { const a = S.designer.afterSave; S.designer = null; if (a) a(null); renderSheet(true); return; } if (S.open || S.builder) { S.open = null; S.builder = null; S.confirmDel = false; renderSheet(); } });
document.addEventListener('change', (ev) => { // camisola interior of a fit, of a day, or of the fit being built
  const t = ev.target; if (!t || !t.dataset || !t.dataset.usel) return;
  const scope = t.dataset.usel, id = t.dataset.uselId, under = UNDER[t.value] ? t.value : '';
  const tgt = scope === 'b' ? S.builder : scope === 'fit' ? S.fits.find((x) => x.id === id) : S.days.find((x) => x.date === id);
  if (!tgt) return;
  tgt.under = under;
  if (scope === 'b') { const n = document.getElementById('bname'); if (n) S.builder.title = n.value; renderSheet(); return; }
  render(); if (db) db.doc((scope === 'fit' ? 'fits/' : 'days/') + id).update({ under }).catch(() => {});
});
document.getElementById('file').addEventListener('change', (e) => handleFile(e.target.files && e.target.files[0]));
document.getElementById('dfile').addEventListener('change', (e) => dzLoadPhoto(e.target.files && e.target.files[0]));

// ---------- data ----------
const rerender = () => render();
function snapErr() { S.offline = !S.pieces.length; render(); }
async function boot() {
  render();
  try { const r = await LS.init(); db = r.db; assets = r.assets; }
  catch (e) { S.ready = true; S.offline = true; render(); return; }
  Cloud.on(Login.render); Cloud.start(); Login.render();
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) { const had = !!navigator.serviceWorker.controller; let done = false; navigator.serviceWorker.addEventListener('controllerchange', () => { if (had && !done && !S.designer && !S.builder) { done = true; location.reload(); } }); navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then((r) => r.update()).catch(() => {}); }
  document.getElementById('ifile').addEventListener('change', (e) => readImport(e.target.files && e.target.files[0]));
  let got = 0; const mark = () => { if (++got >= 4) S.ready = true; rerender(); };
  const sub = (q, key) => q.onSnapshot((s) => {
    S[key] = s.docs.map((x) => ({ id: x.id, ...x.data() }));
    if (key === 'allPieces') {
      S.pieces = S.allPieces.filter((p) => !p.removed);
      const B = S.builder;
      if (B && B.pendingPick && pieceById(B.pendingPick)) { togglePick(B.pendingPick); B.pendingPick = null; if (!S.designer) renderSheet(); }
    }
    if (!S.ready) mark(); else rerender(); }, snapErr);
  sub(db.collection('pieces'), 'allPieces');
  sub(db.collection('uploads').orderBy('createdAt', 'desc').limit(60), 'uploads');
  sub(db.collection('days').orderBy('date', 'desc').limit(1000), 'days');
  sub(db.collection('fits').limit(500), 'fits');
}
boot();
})();
</script>
